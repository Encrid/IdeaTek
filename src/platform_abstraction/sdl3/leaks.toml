[leaks.pairs]
SDL_Metal_CreateView = "SDL_Metal_DestroyView"
SDL_GL_CreateContext = "SDL_GL_DestroyContext"
SDL_CreateSystemCursor = "SDL_DestroyCursor"
SDL_LoadPNG = "SDL_DestroySurface"

[leaks.kinds.sdl3_memory]
takes = { SDL_GetWindows = "result", SDL_GetDisplays = "result", SDL_GetFullscreenDisplayModes = "result", SDL_GetClipboardText = "result" }
gives = { SDL_free = "1" }

[leaks.kinds.sdl3_window]
takes = { SDL_CreateWindow = "result", SDL_CreateWindowWithProperties = "result" }
gives = { SDL_DestroyWindow = "1" }

[leaks.kinds.sdl3_properties]
takes = { SDL_CreateProperties = "result" }
gives = { SDL_DestroyProperties = "1" }

[leaks.kinds.sdl3_subsystem]
takes = { SDL_InitSubSystem = "result" }
gives = { SDL_QuitSubSystem = "1" }
