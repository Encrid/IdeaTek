name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-macos
            runner: macos-latest
            architecture: arm64
          - target: x86_64-macos
            runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/zig-cache/global
          key: zig-${{ hashFiles('.toolchain/toolchain.toml') }}-${{ matrix.target }}
      - name: Runner
        run: python .toolchain/tools/runner.py --target ${{ matrix.target }} | bash -e
      - name: Fetch
        run: python project.py fetch
      - name: Test
        run: python project.py test --part gpu_vulkan_module
      - name: Direct
        if: always()
        run: |
          python project.py test --part vulkan || true
          cd build/${{ matrix.target }}/scratch/cases/platform_abstraction/gpu_vulkan_module/load/0
          cat d.toml
          ls m
          VK_LOADER_DEBUG=error,warn,driver "$GITHUB_WORKSPACE/build/third_party/bridge_host/${{ matrix.target }}/bridge-host" d.toml; echo "exit $?"
          ls ~/Library/Logs/DiagnosticReports/ || true
          for f in ~/Library/Logs/DiagnosticReports/bridge-host*; do head -c 12000 "$f"; done || true
