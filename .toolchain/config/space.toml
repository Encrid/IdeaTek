[parts.space]
name = "BC-IdeaTek-Space"
uses = ["world"]
third_party = []

[parts.space.package]
proof = "tests/space/package/proof.c"
include = ["{bridge}/include", "{root}/include/world"]

[compose.space]
part = "space"
from = "include/space"
headers = ["*.h"]
into = "include"

[variables]
space_probe_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=4096", "log_ring=512",
    "spans=4096", "spawns=none", "changes=1024", "persistent=none", "hot_reload=false",
]

space_spawn_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=4096", "log_ring=512",
    "spans=4096", "spawns=1", "changes=1024", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "space_layout"
kind = "program"
part = "space"
test = true
sources = ["tests/space/layout/layout.c"]
include = ["include/space", "include/world", "{bridge}/include"]

[[artifact]]
name = "space_probe"
kind = "native_module"
part = "space"
test = true
sources = ["tests/space/probe/probe.c"]
include = ["include/space", "include/world", "include/frame"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{space_probe_words}"]

[[artifact.variants]]
name = "space_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "space_mover"
defines = ["ROLE_MOVER"]
manifest = ["test:mover@1.0.0", "{space_spawn_words}"]

[[artifact.variants]]
name = "space_place"
defines = ["ROLE_SPACE"]
manifest = ["test:space@1.0.0", "{space_spawn_words}"]

[[artifact.variants]]
name = "space_reader"
defines = ["ROLE_READER"]
manifest = ["test:reader@1.0.0", "{space_probe_words}"]
