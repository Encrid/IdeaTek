[parts.sdl3]
name = "BL-IdeaTek-SDL3"
folder = "platform_abstraction/sdl3"
uses = []
third_party = ["sdl3", "sdl3_linux"]

[compose.sdl3]
part = "sdl3"
from = "{sdl_root}"
headers = ["include/SDL3/*.h"]

[[source]]
name = "sdl3"
url = "https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20.tar.gz"
sha256 = "f3bb06f55bed9557227a700af2ea62e49497ebdf58037732a731a5fb3ef8581f"
into = "build/third_party/sdl3"
top = "SDL3-3.4.20"
patches = ["third_party/sdl3/build_config.patch", "third_party/sdl3/test_driver.patch"]

[[source]]
name = "sdl3_linux"
url = "https://github.com/castholm/SDL_linux_deps/archive/86b2445cce38b014efeebcb0f3752aff623602fc.tar.gz"
sha256 = "b08bb2a500daa8eb32019deaa1ab24e1759b0834a9701b61a404d62314d754c5"
into = "build/third_party/sdl3_linux"
top = "SDL_linux_deps-86b2445cce38b014efeebcb0f3752aff623602fc"

[[source]]
name = "castholm"
url = "https://github.com/castholm/SDL/archive/refs/tags/v0.6.1+3.4.20.tar.gz"
sha256 = "ba67ea949f5f2c31f0654d537cac15d7de6030ca64cdbca4e89d118cf1a3c1e8"
into = "build/third_party/castholm"
top = "SDL-0.6.1-3.4.20"

[kinds.sdl]
output = "{name}{library}"
steps = [{ run = ["{sdl_build}"] }]

[kinds.sdl_test]
output = "SDL3{library}"
steps = [{ run = ["{sdl_build}"] }]

[[artifact]]
name = "SDL3"
kind = "sdl"
part = "sdl3"
sources = ["{sdl_common}", "{sdl_libm}", "{sdl_sources}"]
include = ["{sdl_root}/include/build_config", "{sdl_root}/include", "{sdl_root}/src"]
defines = ["{sdl_defines}"]
flags = ["{sdl_flags}", "{sdl_system}"]

[[artifact]]
name = "leaks.toml"
kind = "file"
part = "sdl3"
sources = ["src/platform_abstraction/sdl3/leaks.toml"]

[[artifact]]
name = "smoke"
kind = "program"
part = "sdl3"
sources = ["tests/platform_abstraction/sdl3/smoke/smoke.c"]
link = ["{sdl_link}"]
flags = ["-isystem", "{sdl_root}/include"]
test = true

[[artifact]]
name = "parts"
kind = "program"
part = "sdl3"
sources = ["tests/platform_abstraction/sdl3/smoke/parts.c"]
link = ["{sdl_link}"]
flags = ["-isystem", "{sdl_root}/include"]
test = true

[variables]
sdl3_game_words = [
    "abi=1", "config=test:Settings", "pinned=true", "reloadable=false", "settings=script",
    "config.script=none", "scratch=1048576", "log_ring=65536", "spans=262144", "spawns=1024",
    "changes=262144", "persistent=65536", "hot_reload=false",
]
sdl_build = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "-shared", "{pic}", "{soname}", "{optimize}", "{float}", "{errno}", "{define}", "{defines}", "{include}", "{sources}", "{link}", "{flags}", "-o", "{output}"]
sdl_defines = ["{sdl_config}", "DLL_EXPORT=1", "SDL_BUILD_MAJOR_VERSION=3", "SDL_BUILD_MINOR_VERSION=4", "SDL_BUILD_MICRO_VERSION=20"]
sdl_flags = ["-isystem", "{sdl_root}/src/video/khronos", "-fvisibility=hidden", "-fno-strict-aliasing", "-w"]
sdl_link = "{out}/SDL3{library}"
sdl_windows_system = [
    "-lkernel32", "-luser32", "-lgdi32", "-lwinmm", "-limm32", "-lole32", "-loleaut32",
    "-lversion", "-luuid", "-ladvapi32", "-lsetupapi", "-lshell32", "-ldinput8",
]
sdl_linux_system = ["-pthread", "-I", "{sdl_deps}/src", "-isystem", "{sdl_deps}/include"]
sdl_macos_system = [
    "-isystem", "{macos_sdk}/usr/include", "-iframework", "{macos_sdk}/System/Library/Frameworks",
    "-F", "{macos_sdk}/System/Library/Frameworks", "-L", "{macos_sdk}/usr/lib", "-fobjc-arc",
    "-framework", "CoreMedia", "-framework", "CoreVideo", "-framework", "Cocoa",
    "-weak_framework", "UniformTypeIdentifiers", "-framework", "IOKit", "-framework", "ForceFeedback",
    "-framework", "Carbon", "-framework", "CoreAudio", "-framework", "AudioToolbox",
    "-framework", "AVFoundation", "-framework", "Foundation", "-framework", "GameController",
    "-framework", "Metal", "-framework", "QuartzCore", "-weak_framework", "CoreHaptics",
]

[targets.x86_64-windows-gnu]
sdl_sources = ["{sdl_windows}"]
sdl_config = ["{sdl_config_windows}", "{sdl_simd_x86_64}"]
sdl_system = ["{sdl_windows_system}"]
default_gl = "0"
metal_layer = "0"

[targets.aarch64-windows-gnu]
sdl_sources = ["{sdl_windows}"]
sdl_config = ["{sdl_config_windows}", "{sdl_simd_aarch64}"]
sdl_system = ["{sdl_windows_system}"]
default_gl = "0"
metal_layer = "0"

[targets.x86_64-linux-gnu]
sdl_sources = ["{sdl_linux}", "{sdl_wayland}"]
sdl_config = ["{sdl_config_linux}", "{sdl_simd_x86_64}"]
sdl_system = ["{sdl_linux_system}", "-isystem", "{sdl_deps}/include/x86_64-linux-gnu"]
default_gl = "0"
metal_layer = "0"

[targets.aarch64-linux-gnu]
sdl_sources = ["{sdl_linux}", "{sdl_wayland}"]
sdl_config = ["{sdl_config_linux}", "{sdl_simd_aarch64}"]
sdl_system = ["{sdl_linux_system}", "-isystem", "{sdl_deps}/include/aarch64-linux-gnu"]
default_gl = "0"
metal_layer = "0"

[targets.x86_64-macos]
sdl_sources = ["{sdl_macos}"]
sdl_config = ["{sdl_config_macos}", "{sdl_simd_core2}"]
sdl_system = ["{sdl_macos_system}"]
default_gl = "1"
metal_layer = "1"

[targets.aarch64-macos]
sdl_sources = ["{sdl_macos}"]
sdl_config = ["{sdl_config_macos}", "{sdl_simd_aarch64}"]
sdl_system = ["{sdl_macos_system}"]
default_gl = "1"
metal_layer = "1"

[[artifact]]
name = "SDL3_test"
kind = "sdl_test"
part = "sdl3"
test = true
folder = "sdl3_test"
sources = ["{sdl_common}", "{sdl_libm}", "{sdl_sources}", "tests/platform_abstraction/sdl3/test_video/test_video.c", "tests/platform_abstraction/sdl3/test_audio/test_audio.c"]
include = ["{sdl_root}/include/build_config", "{sdl_root}/include", "{sdl_root}/src"]
defines = ["{sdl_defines}", "SDL_VIDEO_DRIVER_IDEATEK_TEST=1", "SDL_AUDIO_DRIVER_IDEATEK_TEST=1"]
flags = ["{sdl_flags}", "{sdl_system}"]

[[artifact]]
name = "sdl3_game"
kind = "native_module"
part = "sdl3"
test = true
sources = ["tests/platform_abstraction/sdl3/game/*.c"]
include = ["include/platform_abstraction", "include/kernel", "include/engine_subsystems"]
link = ["{out}/SDL3{library}"]
flags = ["-isystem", "{sdl_root}/include", "{rpath}"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_early"
defines = ["GAME_EARLY"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_gpu"
defines = ["GAME_GPU"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_frame"
defines = ["GAME_FRAME"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_files"
defines = ["GAME_FILES"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_audio"
defines = ["GAME_AUDIO"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_sockets"
defines = ["GAME_SOCKETS"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_states"
defines = ["GAME_STATES"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_space"
defines = ["GAME_FRAME", "GAME_SPACE"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_bench"
defines = ["GAME_SPACE", "GAME_BENCH"]
sources = ["tests/platform_abstraction/sdl3/game/*.c", "tests/engine_subsystems/space_bridge/bench_sum.c"]
include = ["include/platform_abstraction", "include/kernel", "include/engine_subsystems", "tests/engine_subsystems/space_bridge"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_resources"
defines = ["GAME_FILES", "GAME_RESOURCES"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_resources_early"
defines = ["GAME_FILES", "GAME_RESOURCES", "GAME_INIT_LOADER"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_ktx2"
defines = ["GAME_FILES", "GAME_RESOURCES", "GAME_KTX2"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_gltf"
defines = ["GAME_FILES", "GAME_RESOURCES", "GAME_KTX2", "GAME_GLTF"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_level"
defines = ["GAME_FILES", "GAME_RESOURCES", "GAME_KTX2", "GAME_GLTF", "GAME_LEVEL"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_all"
defines = ["GAME_GPU", "GAME_FRAME"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_step3"
defines = ["GAME_GPU", "GAME_FRAME", "GAME_FILES", "GAME_AUDIO", "GAME_SOCKETS", "GAME_STATES", "GAME_RESOURCES"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]

[[artifact.variants]]
name = "sdl3_game_step2"
defines = ["GAME_GPU", "GAME_FRAME", "GAME_FILES", "GAME_AUDIO", "GAME_SOCKETS"]
manifest = ["test:game@1.0.0", "{sdl3_game_words}"]
