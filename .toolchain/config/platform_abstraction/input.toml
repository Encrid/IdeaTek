[parts.input]
name = "BC-IdeaTek-Input"
folder = "platform_abstraction/input"
uses = ["world", "window"]
third_party = []

[parts.input.package]
proof = "tests/platform_abstraction/input_proof.c"
include = ["{bridge}/include", "{root}/include/platform_abstraction"]

[compose.input]
part = "input"
from = "include/platform_abstraction"
headers = ["ideatek_input_gamepad.h", "ideatek_input.h", "ideatek_input_keyboard.h", "ideatek_input_mouse.h", "ideatek_input_text.h", "ideatek_input_touch.h"]
into = "include"

[variables]
input_probe_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=32768", "log_ring=512",
    "spans=65536", "spawns=none", "changes=16384", "persistent=none", "hot_reload=false",
]

input_spawn_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=32768", "log_ring=512",
    "spans=65536", "spawns=2", "changes=16384", "persistent=16", "hot_reload=false",
]

input_module_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=32768", "log_ring=512",
    "spans=65536", "spawns=2", "changes=16384", "persistent=16", "hot_reload=false",
]

[[artifact]]
name = "input_layout"
kind = "program"
part = "input"
test = true
sources = ["tests/platform_abstraction/input_layout.c"]
include = ["include/platform_abstraction", "{bridge}/include"]

[[artifact]]
name = "input_probe"
kind = "native_module"
part = "input"
test = true
sources = ["tests/platform_abstraction/input_probe.c"]
include = ["include/platform_abstraction"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{input_probe_words}"]


[[artifact.variants]]
name = "input_late"
defines = ["ROLE_LATE"]
manifest = ["test:probe@1.0.0", "{input_probe_words}"]

[[artifact.variants]]
name = "input_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{input_spawn_words}"]

[[artifact.variants]]
name = "input_module"
defines = ["ROLE_INPUT"]
manifest = ["test:input@1.0.0", "{input_module_words}"]

[[artifact.variants]]
name = "input_reader"
defines = ["ROLE_READER"]
manifest = ["test:reader@1.0.0", "{input_probe_words}"]
