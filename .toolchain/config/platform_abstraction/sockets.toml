[parts.sockets]
name = "BC-IdeaTek-Sockets"
folder = "platform_abstraction/sockets"
uses = ["world"]
third_party = []

[parts.sockets.package]
proof = "tests/platform_abstraction/sockets_proof.c"
include = ["{bridge}/include", "{root}/include/platform_abstraction"]

[compose.sockets]
part = "sockets"
from = "include/platform_abstraction"
headers = ["ideatek_sockets.h"]
into = "include"

[variables]
sockets_probe_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=none", "changes=65536", "persistent=none", "hot_reload=false",
]

sockets_spawn_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=1", "changes=65536", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "sockets_layout"
kind = "program"
part = "sockets"
test = true
sources = ["tests/platform_abstraction/sockets_layout.c"]
include = ["include/platform_abstraction", "{bridge}/include"]

[[artifact]]
name = "sockets_probe"
kind = "native_module"
part = "sockets"
test = true
sources = ["tests/platform_abstraction/sockets_probe.c"]
include = ["include/platform_abstraction"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{sockets_probe_words}"]

[[artifact.variants]]
name = "sockets_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "sockets_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{sockets_spawn_words}"]

[[artifact.variants]]
name = "sockets_module"
defines = ["ROLE_MODULE"]
manifest = ["test:module@1.0.0", "{sockets_spawn_words}"]
