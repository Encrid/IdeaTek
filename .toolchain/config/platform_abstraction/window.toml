[parts.window]
name = "BC-IdeaTek-Window"
folder = "platform_abstraction/window"
uses = ["world"]
third_party = []

[parts.window.package]
proof = "tests/platform_abstraction/window_proof.c"
include = ["{bridge}/include", "{root}/include/platform_abstraction"]

[compose.window]
part = "window"
from = "include/platform_abstraction"
headers = ["ideatek_window_clipboard.h", "ideatek_window.h"]
into = "include"

[variables]
window_probe_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=8192", "log_ring=512",
    "spans=4096", "spawns=none", "changes=1024", "persistent=none", "hot_reload=false",
]

window_spawn_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=8192", "log_ring=512",
    "spans=4096", "spawns=2", "changes=1024", "persistent=16", "hot_reload=false",
]

window_drop_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=8192", "log_ring=512",
    "spans=4096", "spawns=3", "changes=1024", "persistent=32", "hot_reload=false",
]

[[artifact]]
name = "window_layout"
kind = "program"
part = "window"
test = true
sources = ["tests/platform_abstraction/window_layout.c"]
include = ["include/platform_abstraction", "{bridge}/include"]

[[artifact]]
name = "window_probe"
kind = "native_module"
part = "window"
test = true
sources = ["tests/platform_abstraction/window_probe.c"]
include = ["include/platform_abstraction"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{window_probe_words}"]


[[artifact.variants]]
name = "window_late"
defines = ["ROLE_LATE"]
manifest = ["test:probe@1.0.0", "{window_probe_words}"]

[[artifact.variants]]
name = "window_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{window_spawn_words}"]

[[artifact.variants]]
name = "window_module"
defines = ["ROLE_WINDOW"]
manifest = ["test:window@1.0.0", "{window_drop_words}"]

[[artifact.variants]]
name = "window_clock"
defines = ["ROLE_CLOCK"]
manifest = ["test:clock@1.0.0", "{window_spawn_words}"]

[[artifact.variants]]
name = "window_reader"
defines = ["ROLE_READER"]
manifest = ["test:reader@1.0.0", "{window_probe_words}"]
