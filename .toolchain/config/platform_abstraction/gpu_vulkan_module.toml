[parts.gpu_vulkan_module]
name = "BM-IdeaTek-Gpu-Vulkan"
folder = "platform_abstraction/gpu_vulkan_module"
uses = ["vulkan", "gpu", "sdl3", "window_sdl3"]
third_party = ["volk", "vulkan_headers"]

[variables]
gpu_vulkan_words = [
    "abi=1", "config=ideatek_gpu_vulkan:Settings", "pinned=true", "reloadable=false",
    "settings=frames_in_flight image_count validation", "config.frames_in_flight=2",
    "config.image_count=3", "config.validation=false",
    "scratch=16384", "log_ring=2048", "spans=65536", "spawns=64", "changes=4096",
    "persistent=512", "hot_reload=false",
]

[[artifact]]
name = "gpu_vulkan_module"
kind = "native_module"
part = "gpu_vulkan_module"
sources = ["src/platform_abstraction/gpu_vulkan_module/*.c"]
include = ["include/platform_abstraction", "src/platform_abstraction/gpu_vulkan_module", "{volk_root}", "{vulkan_root}/include"]
link = ["{out}/volk.a"]
flags = ["{vulkan_include}"]
manifest = ["ideatek_gpu_vulkan:gpu@0.1.0", "{gpu_vulkan_words}"]

[[artifact]]
name = "gpu_vulkan_module_reload"
kind = "program"
part = "gpu_vulkan_module"
test = true
sources = ["tests/platform_abstraction/sdl3/reload.c"]
link = ["{out}/gpu_vulkan_module{library}"]
