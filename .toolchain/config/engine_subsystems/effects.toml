[parts.effects]
name = "BC-IdeaTek-Effects"
folder = "engine_subsystems/effects"
uses = ["world", "space", "rendering", "physics", "fields"]
third_party = []

[parts.effects.package]
proof = "tests/engine_subsystems/effects/package/proof.c"
include = ["{bridge}/include", "{root}/include/platform_abstraction/world", "{root}/include/engine_subsystems/space", "{root}/include/engine_subsystems/rendering"]

[compose.effects]
part = "effects"
from = "include/engine_subsystems/effects"
headers = ["*.h"]
into = "include"

[variables]
effects_probe_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=none", "changes=65536", "persistent=none", "hot_reload=false",
]

effects_spawn_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=1", "changes=65536", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "effects_layout"
kind = "program"
part = "effects"
test = true
sources = ["tests/engine_subsystems/effects/layout/layout.c"]
include = ["include/engine_subsystems/effects", "include/platform_abstraction/world", "include/engine_subsystems/space", "include/engine_subsystems/rendering", "{bridge}/include"]

[[artifact]]
name = "effects_probe"
kind = "native_module"
part = "effects"
test = true
sources = ["tests/engine_subsystems/effects/probe/probe.c"]
include = ["include/engine_subsystems/effects", "include/platform_abstraction/world", "include/engine_subsystems/space", "include/engine_subsystems/rendering", "include/engine_subsystems/physics", "include/engine_subsystems/fields"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{effects_probe_words}"]

[[artifact.variants]]
name = "effects_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "effects_author"
defines = ["ROLE_AUTHOR"]
manifest = ["test:author@1.0.0", "{effects_spawn_words}"]

[[artifact.variants]]
name = "effects_effects"
defines = ["ROLE_EFFECTS"]
manifest = ["test:effects@1.0.0", "{effects_spawn_words}"]
