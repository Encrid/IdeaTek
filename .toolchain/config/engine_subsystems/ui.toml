[parts.ui]
name = "BC-IdeaTek-Ui"
folder = "engine_subsystems/ui"
uses = ["world", "space", "window", "input", "rendering", "input_mapping"]
third_party = []

[parts.ui.package]
proof = "tests/engine_subsystems/ui/package/proof.c"
include = ["{bridge}/include", "{root}/include/platform_abstraction/world", "{root}/include/engine_subsystems/space", "{root}/include/engine_subsystems/rendering"]

[compose.ui]
part = "ui"
from = "include/engine_subsystems/ui"
headers = ["*.h"]
into = "include"

[variables]
ui_probe_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=none", "changes=65536", "persistent=none", "hot_reload=false",
]

ui_spawn_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=1", "changes=65536", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "ui_layout"
kind = "program"
part = "ui"
test = true
sources = ["tests/engine_subsystems/ui/layout/layout.c"]
include = ["include/engine_subsystems/ui", "include/platform_abstraction/world", "include/engine_subsystems/space", "include/engine_subsystems/rendering", "{bridge}/include"]

[[artifact]]
name = "ui_probe"
kind = "native_module"
part = "ui"
test = true
sources = ["tests/engine_subsystems/ui/probe/probe.c"]
include = ["include/engine_subsystems/ui", "include/platform_abstraction/world", "include/engine_subsystems/space", "include/engine_subsystems/rendering"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{ui_probe_words}"]

[[artifact.variants]]
name = "ui_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "ui_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{ui_spawn_words}"]

[[artifact.variants]]
name = "ui_module"
defines = ["ROLE_MODULE"]
manifest = ["test:module@1.0.0", "{ui_spawn_words}"]
