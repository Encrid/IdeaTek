[parts.rendering]
name = "BC-IdeaTek-Rendering"
folder = "engine_subsystems/rendering"
uses = ["world", "space"]
third_party = []

[parts.rendering.package]
proof = "tests/engine_subsystems/rendering_proof.c"
include = ["{bridge}/include", "{root}/include/engine_subsystems", "{root}/include/platform_abstraction"]

[compose.rendering]
part = "rendering"
from = "include/engine_subsystems"
headers = ["ideatek_rendering.h"]
into = "include"

[variables]
rendering_probe_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=none", "changes=65536", "persistent=none", "hot_reload=false",
]

rendering_spawn_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=1", "changes=65536", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "rendering_layout"
kind = "program"
part = "rendering"
test = true
sources = ["tests/engine_subsystems/rendering_layout.c"]
include = ["include/engine_subsystems", "include/platform_abstraction", "{bridge}/include"]

[[artifact]]
name = "rendering_probe"
kind = "native_module"
part = "rendering"
test = true
sources = ["tests/engine_subsystems/rendering_probe.c"]
include = ["include/engine_subsystems", "include/platform_abstraction"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{rendering_probe_words}"]

[[artifact.variants]]
name = "rendering_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "rendering_author"
defines = ["ROLE_AUTHOR"]
manifest = ["test:author@1.0.0", "{rendering_spawn_words}"]

[[artifact.variants]]
name = "rendering_renderer"
defines = ["ROLE_RENDERER"]
manifest = ["test:renderer@1.0.0", "{rendering_probe_words}"]
