[parts.debug_draw]
name = "BC-IdeaTek-DebugDraw"
folder = "engine_subsystems/debug_draw"
uses = []
third_party = []

[parts.debug_draw.package]
proof = "tests/engine_subsystems/debug_draw_proof.c"
include = ["{bridge}/include", "{root}/include/engine_subsystems"]

[compose.debug_draw]
part = "debug_draw"
from = "include/engine_subsystems"
headers = ["ideatek_debug_draw.h"]
into = "include"

[variables]
debug_draw_probe_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=none", "changes=65536", "persistent=none", "hot_reload=false",
]

debug_draw_spawn_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=1", "changes=65536", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "debug_draw_layout"
kind = "program"
part = "debug_draw"
test = true
sources = ["tests/engine_subsystems/debug_draw_layout.c"]
include = ["include/engine_subsystems", "{bridge}/include"]

[[artifact]]
name = "debug_draw_probe"
kind = "native_module"
part = "debug_draw"
test = true
sources = ["tests/engine_subsystems/debug_draw_probe.c"]
include = ["include/engine_subsystems"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{debug_draw_probe_words}"]

[[artifact.variants]]
name = "debug_draw_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "debug_draw_drawer"
defines = ["ROLE_DRAWER"]
manifest = ["test:drawer@1.0.0", "{debug_draw_spawn_words}"]

[[artifact.variants]]
name = "debug_draw_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{debug_draw_spawn_words}"]

[[artifact.variants]]
name = "debug_draw_module"
defines = ["ROLE_MODULE"]
manifest = ["test:module@1.0.0", "{debug_draw_probe_words}"]
