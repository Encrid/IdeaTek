[parts.matter]
name = "BC-IdeaTek-Matter"
folder = "engine_subsystems/matter"
uses = ["world", "space", "frame", "rendering", "physics"]
third_party = []

[parts.matter.package]
proof = "tests/engine_subsystems/matter_proof.c"
include = ["{bridge}/include", "{root}/include/engine_subsystems", "{root}/include/platform_abstraction"]

[compose.matter]
part = "matter"
from = "include/engine_subsystems"
headers = ["ideatek_matter.h"]
into = "include"

[variables]
matter_probe_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=4096", "log_ring=512",
    "spans=4096", "spawns=none", "changes=1024", "persistent=none", "hot_reload=false",
]

matter_spawn_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=4096", "log_ring=512",
    "spans=4096", "spawns=1", "changes=1024", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "matter_layout"
kind = "program"
part = "matter"
test = true
sources = ["tests/engine_subsystems/matter_layout.c"]
include = ["include/engine_subsystems", "include/platform_abstraction", "{bridge}/include"]

[[artifact]]
name = "matter_probe"
kind = "native_module"
part = "matter"
test = true
sources = ["tests/engine_subsystems/matter_probe.c"]
include = ["include/engine_subsystems", "include/platform_abstraction"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{matter_probe_words}"]

[[artifact.variants]]
name = "matter_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "matter_author"
defines = ["ROLE_AUTHOR"]
manifest = ["test:author@1.0.0", "{matter_spawn_words}"]

[[artifact.variants]]
name = "matter_module"
defines = ["ROLE_MATTER"]
manifest = ["test:matter@1.0.0", "{matter_spawn_words}"]

[[artifact.variants]]
name = "matter_reader"
defines = ["ROLE_READER"]
manifest = ["test:reader@1.0.0", "{matter_probe_words}"]
