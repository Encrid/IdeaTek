[parts.fields]
name = "BC-IdeaTek-Fields"
folder = "engine_subsystems/fields"
uses = ["world", "space"]
third_party = []

[parts.fields.package]
proof = "tests/engine_subsystems/fields/package/proof.c"
include = ["{bridge}/include", "{root}/include/platform_abstraction/world", "{root}/include/engine_subsystems/space"]

[compose.fields]
part = "fields"
from = "include/engine_subsystems/fields"
headers = ["*.h"]
into = "include"

[variables]
fields_probe_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=none", "changes=65536", "persistent=none", "hot_reload=false",
]

fields_spawn_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=1", "changes=65536", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "fields_layout"
kind = "program"
part = "fields"
test = true
sources = ["tests/engine_subsystems/fields/layout/layout.c"]
include = ["include/engine_subsystems/fields", "include/platform_abstraction/world", "include/engine_subsystems/space", "{bridge}/include"]

[[artifact]]
name = "fields_probe"
kind = "native_module"
part = "fields"
test = true
sources = ["tests/engine_subsystems/fields/probe/probe.c"]
include = ["include/engine_subsystems/fields", "include/platform_abstraction/world", "include/engine_subsystems/space"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{fields_probe_words}"]

[[artifact.variants]]
name = "fields_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "fields_author"
defines = ["ROLE_AUTHOR"]
manifest = ["test:author@1.0.0", "{fields_spawn_words}"]

[[artifact.variants]]
name = "fields_reader"
defines = ["ROLE_READER"]
manifest = ["test:reader@1.0.0", "{fields_probe_words}"]
