[parts.terrain]
name = "BC-IdeaTek-Terrain"
folder = "engine_subsystems/terrain"
uses = ["world", "space", "rendering", "physics"]
third_party = []

[parts.terrain.package]
proof = "tests/engine_subsystems/terrain_proof.c"
include = ["{bridge}/include", "{root}/include/engine_subsystems", "{root}/include/platform_abstraction"]

[compose.terrain]
part = "terrain"
from = "include/engine_subsystems"
headers = ["ideatek_terrain.h"]
into = "include"

[variables]
terrain_probe_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=none", "changes=65536", "persistent=none", "hot_reload=false",
]

terrain_spawn_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=1", "changes=65536", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "terrain_layout"
kind = "program"
part = "terrain"
test = true
sources = ["tests/engine_subsystems/terrain_layout.c"]
include = ["include/engine_subsystems", "include/platform_abstraction", "{bridge}/include"]

[[artifact]]
name = "terrain_probe"
kind = "native_module"
part = "terrain"
test = true
sources = ["tests/engine_subsystems/terrain_probe.c"]
include = ["include/engine_subsystems", "include/platform_abstraction"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{terrain_probe_words}"]

[[artifact.variants]]
name = "terrain_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "terrain_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{terrain_spawn_words}"]

[[artifact.variants]]
name = "terrain_module"
defines = ["ROLE_MODULE"]
manifest = ["test:module@1.0.0", "{terrain_spawn_words}"]

[[artifact.variants]]
name = "terrain_generator"
defines = ["ROLE_GENERATOR"]
manifest = ["test:generator@1.0.0", "{terrain_spawn_words}"]
