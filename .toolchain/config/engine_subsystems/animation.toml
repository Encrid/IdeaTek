[parts.animation]
name = "BC-IdeaTek-Animation"
folder = "engine_subsystems/animation"
uses = ["world", "space", "frame", "states"]
third_party = []

[parts.animation.package]
proof = "tests/engine_subsystems/animation_proof.c"
include = ["{bridge}/include", "{root}/include/engine_subsystems", "{root}/include/platform_abstraction"]

[compose.animation]
part = "animation"
from = "include/engine_subsystems"
headers = ["ideatek_animation.h"]
into = "include"

[variables]
animation_probe_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=none", "changes=65536", "persistent=none", "hot_reload=false",
]

animation_spawn_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=1", "changes=65536", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "animation_layout"
kind = "program"
part = "animation"
test = true
sources = ["tests/engine_subsystems/animation_layout.c"]
include = ["include/engine_subsystems", "include/platform_abstraction", "{bridge}/include"]

[[artifact]]
name = "animation_probe"
kind = "native_module"
part = "animation"
test = true
sources = ["tests/engine_subsystems/animation_probe.c"]
include = ["include/engine_subsystems", "include/platform_abstraction", "include/kernel"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{animation_probe_words}"]

[[artifact.variants]]
name = "animation_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "animation_author"
defines = ["ROLE_AUTHOR"]
manifest = ["test:author@1.0.0", "{animation_spawn_words}"]

[[artifact.variants]]
name = "animation_animator"
defines = ["ROLE_ANIMATOR"]
manifest = ["test:animator@1.0.0", "{animation_spawn_words}"]

[[artifact.variants]]
name = "animation_solver"
defines = ["ROLE_SOLVER"]
manifest = ["test:solver@1.0.0", "{animation_spawn_words}"]

[[artifact.variants]]
name = "animation_renderer"
defines = ["ROLE_RENDERER"]
manifest = ["test:renderer@1.0.0", "{animation_probe_words}"]
