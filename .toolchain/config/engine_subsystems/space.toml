[parts.space]
name = "BC-IdeaTek-Space"
folder = "engine_subsystems/space"
uses = ["world"]
third_party = []

[parts.space.package]
proof = "tests/engine_subsystems/space_proof.c"
include = ["{bridge}/include", "{root}/include/platform_abstraction"]

[compose.space]
part = "space"
from = "include/engine_subsystems"
headers = ["ideatek_space.h"]
into = "include"

[variables]
space_probe_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=4096", "log_ring=512",
    "spans=4096", "spawns=none", "changes=1024", "persistent=none", "hot_reload=false",
]

space_spawn_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=4096", "log_ring=512",
    "spans=4096", "spawns=1", "changes=1024", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "space_layout"
kind = "program"
part = "space"
test = true
sources = ["tests/engine_subsystems/space_layout.c"]
include = ["include/engine_subsystems", "include/platform_abstraction", "{bridge}/include"]

[[artifact]]
name = "space_probe"
kind = "native_module"
part = "space"
test = true
sources = ["tests/engine_subsystems/space_probe.c"]
include = ["include/engine_subsystems", "include/platform_abstraction", "include/kernel"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{space_probe_words}"]

[[artifact.variants]]
name = "space_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "space_mover"
defines = ["ROLE_MOVER"]
manifest = ["test:mover@1.0.0", "{space_spawn_words}"]

[[artifact.variants]]
name = "space_place"
defines = ["ROLE_SPACE"]
manifest = ["test:space@1.0.0", "{space_spawn_words}"]

[[artifact.variants]]
name = "space_reader"
defines = ["ROLE_READER"]
manifest = ["test:reader@1.0.0", "{space_probe_words}"]

[[artifact.variants]]
name = "space_reader_remove"
defines = ["ROLE_READER", "ROLE_REMOVE"]
manifest = ["test:reader@1.0.0", "{space_probe_words}"]
