[parts.subtitles]
name = "BC-IdeaTek-Subtitles"
folder = "engine_subsystems/subtitles"
uses = ["world", "sound"]
third_party = []

[parts.subtitles.package]
proof = "tests/engine_subsystems/subtitles/package/proof.c"
include = ["{bridge}/include", "{root}/include/platform_abstraction/world"]

[compose.subtitles]
part = "subtitles"
from = "include/engine_subsystems/subtitles"
headers = ["*.h"]
into = "include"

[variables]
subtitles_probe_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=none", "changes=65536", "persistent=none", "hot_reload=false",
]

subtitles_spawn_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=1", "changes=65536", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "subtitles_layout"
kind = "program"
part = "subtitles"
test = true
sources = ["tests/engine_subsystems/subtitles/layout/layout.c"]
include = ["include/engine_subsystems/subtitles", "include/platform_abstraction/world", "{bridge}/include"]

[[artifact]]
name = "subtitles_probe"
kind = "native_module"
part = "subtitles"
test = true
sources = ["tests/engine_subsystems/subtitles/probe/probe.c"]
include = ["include/engine_subsystems/subtitles", "include/platform_abstraction/world", "include/engine_subsystems/sound", "include/platform_abstraction/audio"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{subtitles_probe_words}"]

[[artifact.variants]]
name = "subtitles_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "subtitles_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{subtitles_spawn_words}"]

[[artifact.variants]]
name = "subtitles_module"
defines = ["ROLE_MODULE"]
manifest = ["test:module@1.0.0", "{subtitles_spawn_words}"]
