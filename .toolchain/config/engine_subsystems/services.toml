[parts.services]
name = "BC-IdeaTek-Services"
folder = "engine_subsystems/services"
uses = ["world", "input", "audio", "files", "sockets"]
third_party = []

[parts.services.package]
proof = "tests/engine_subsystems/services/package/proof.c"
include = ["{bridge}/include", "{root}/include/platform_abstraction/world"]

[compose.services]
part = "services"
from = "include/engine_subsystems/services"
headers = ["*.h"]
into = "include"

[variables]
services_probe_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=none", "changes=65536", "persistent=none", "hot_reload=false",
]

services_spawn_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=1", "changes=65536", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "services_layout"
kind = "program"
part = "services"
test = true
sources = ["tests/engine_subsystems/services/layout/layout.c"]
include = ["include/engine_subsystems/services", "include/platform_abstraction/world", "{bridge}/include"]

[[artifact]]
name = "services_probe"
kind = "native_module"
part = "services"
test = true
sources = ["tests/engine_subsystems/services/probe/probe.c"]
include = ["include/engine_subsystems/services", "include/platform_abstraction/world"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{services_probe_words}"]

[[artifact.variants]]
name = "services_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "services_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{services_spawn_words}"]

[[artifact.variants]]
name = "services_module"
defines = ["ROLE_MODULE"]
manifest = ["test:module@1.0.0", "{services_spawn_words}"]
