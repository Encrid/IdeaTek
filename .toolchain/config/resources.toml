[parts.resources]
name = "BC-IdeaTek-Resources"
folder = "resources"
uses = ["world", "files"]
third_party = []

[parts.resources.package]
proof = "tests/resources/package/proof.c"
include = ["{bridge}/include", "{root}/include/world"]

[compose.resources]
part = "resources"
from = "include/resources"
headers = ["*.h"]
into = "include"

[variables]
resources_probe_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=4096", "log_ring=512",
    "spans=4096", "spawns=none", "changes=1024", "persistent=none", "hot_reload=false",
]

resources_spawn_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=4096", "log_ring=512",
    "spans=4096", "spawns=2", "changes=1024", "persistent=128", "hot_reload=false",
]

[[artifact]]
name = "resources_layout"
kind = "program"
part = "resources"
test = true
sources = ["tests/resources/layout/layout.c"]
include = ["include/resources", "include/world", "{bridge}/include"]

[[artifact]]
name = "resources_probe"
kind = "native_module"
part = "resources"
test = true
sources = ["tests/resources/probe/probe.c"]
include = ["include/resources", "include/world", "include/files"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{resources_probe_words}"]

[[artifact.variants]]
name = "resources_late"
defines = ["ROLE_LATE"]
manifest = ["test:probe@1.0.0", "{resources_probe_words}"]

[[artifact.variants]]
name = "resources_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{resources_spawn_words}"]

[[artifact.variants]]
name = "resources_loader"
defines = ["ROLE_LOADER"]
manifest = ["test:loader@1.0.0", "{resources_spawn_words}"]

[[artifact.variants]]
name = "resources_module"
defines = ["ROLE_RESOURCES"]
manifest = ["test:resources@1.0.0", "{resources_spawn_words}"]
