[parts.localization]
name = "BC-IdeaTek-Localization"
folder = "kernel/localization"
uses = ["world"]
third_party = []

[parts.localization.package]
proof = "tests/kernel/localization_proof.c"
include = ["{bridge}/include", "{root}/include/kernel", "{root}/include/platform_abstraction"]

[compose.localization]
part = "localization"
from = "include/kernel"
headers = ["ideatek_localization.h"]
into = "include"

[variables]
localization_probe_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=none", "changes=65536", "persistent=none", "hot_reload=false",
]

localization_spawn_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=1", "changes=65536", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "localization_layout"
kind = "program"
part = "localization"
test = true
sources = ["tests/kernel/localization_layout.c"]
include = ["include/kernel", "include/platform_abstraction", "{bridge}/include"]

[[artifact]]
name = "localization_probe"
kind = "native_module"
part = "localization"
test = true
sources = ["tests/kernel/localization_probe.c"]
include = ["include/kernel", "include/platform_abstraction"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{localization_probe_words}"]

[[artifact.variants]]
name = "localization_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "localization_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{localization_spawn_words}"]

[[artifact.variants]]
name = "localization_loader"
defines = ["ROLE_LOADER"]
manifest = ["test:loader@1.0.0", "{localization_spawn_words}"]

[[artifact.variants]]
name = "localization_module"
defines = ["ROLE_MODULE"]
manifest = ["test:module@1.0.0", "{localization_spawn_words}"]
