[parts.changes]
name = "BC-IdeaTek-Changes"
folder = "kernel/changes"
uses = ["world"]
third_party = []

[parts.changes.package]
proof = "tests/kernel/changes_proof.c"
include = ["{bridge}/include", "{root}/include/kernel", "{root}/include/platform_abstraction"]

[compose.changes]
part = "changes"
from = "include/kernel"
headers = ["ideatek_changes.h"]
into = "include"

[variables]
changes_probe_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=none", "changes=65536", "persistent=none", "hot_reload=false",
]

changes_spawn_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=1", "changes=65536", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "changes_layout"
kind = "program"
part = "changes"
test = true
sources = ["tests/kernel/changes_layout.c"]
include = ["include/kernel", "include/platform_abstraction", "{bridge}/include"]

[[artifact]]
name = "changes_probe"
kind = "native_module"
part = "changes"
test = true
sources = ["tests/kernel/changes_probe.c"]
include = ["include/kernel", "include/platform_abstraction"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{changes_probe_words}"]

[[artifact.variants]]
name = "changes_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "changes_module"
defines = ["ROLE_MODULE"]
manifest = ["test:module@1.0.0", "{changes_spawn_words}"]

[[artifact.variants]]
name = "changes_ids"
defines = ["ROLE_IDS"]
manifest = ["test:ids@1.0.0", "{changes_spawn_words}"]

[[artifact.variants]]
name = "changes_consumer"
defines = ["ROLE_CONSUMER"]
manifest = ["test:consumer@1.0.0", "{changes_spawn_words}"]

[[artifact.variants]]
name = "changes_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{changes_spawn_words}"]
