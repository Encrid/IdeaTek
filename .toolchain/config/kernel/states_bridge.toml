[parts.states_bridge]
name = "BM-IdeaTek-States-Bridge"
folder = "kernel/states_bridge"
uses = ["states", "world", "sdl3"]
third_party = []

[variables]
states_bridge_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=4096", "log_ring=512",
    "spans=8192", "spawns=none", "changes=16384", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "states_bridge"
kind = "native_module"
part = "states_bridge"
sources = ["src/kernel/states_bridge/*.c"]
include = ["include/kernel", "include/platform_abstraction", "src/kernel/states_bridge"]
manifest = ["ideatek_states_bridge:states@0.1.0", "{states_bridge_words}"]

[[artifact]]
name = "states_bridge_reload"
kind = "program"
part = "states_bridge"
test = true
sources = ["tests/platform_abstraction/sdl3/reload.c"]
link = ["{out}/states_bridge{library}"]

[[artifact]]
name = "states_chain"
kind = "program"
part = "states_bridge"
test = true
sources = ["tests/kernel/states_bridge/chain.c", "src/kernel/states_bridge/states_chain.c"]
include = ["src/kernel/states_bridge"]
