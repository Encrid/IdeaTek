[parts.resources]
name = "BC-IdeaTek-Resources"
folder = "kernel/resources"
uses = ["world", "files"]
third_party = []

[parts.resources.package]
proof = "tests/kernel/resources_proof.c"
include = ["{bridge}/include", "{root}/include/kernel", "{root}/include/platform_abstraction"]

[compose.resources]
part = "resources"
from = "include/kernel"
headers = ["ideatek_resources.h"]
into = "include"

[variables]
resources_probe_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=none", "changes=65536", "persistent=none", "hot_reload=false",
]

resources_spawn_words = [
    "abi=1", "config=none", "pinned=false", "reloadable=false", "scratch=65536", "log_ring=512",
    "spans=65536", "spawns=1", "changes=65536", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "resources_layout"
kind = "program"
part = "resources"
test = true
sources = ["tests/kernel/resources_layout.c"]
include = ["include/kernel", "include/platform_abstraction", "{bridge}/include"]

[[artifact]]
name = "resources_probe"
kind = "native_module"
part = "resources"
test = true
sources = ["tests/kernel/resources_probe.c"]
include = ["include/kernel", "include/platform_abstraction"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{resources_probe_words}"]

[[artifact.variants]]
name = "resources_late"
defines = ["ROLE_LATE"]

[[artifact.variants]]
name = "resources_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{resources_spawn_words}"]

[[artifact.variants]]
name = "resources_loader"
defines = ["ROLE_LOADER"]
manifest = ["test:loader@1.0.0", "{resources_spawn_words}"]

[[artifact.variants]]
name = "resources_source"
defines = ["ROLE_SOURCE"]
manifest = ["test:source@1.0.0", "{resources_spawn_words}"]

[[artifact.variants]]
name = "resources_module"
defines = ["ROLE_MODULE"]
manifest = ["test:module@1.0.0", "{resources_spawn_words}"]
