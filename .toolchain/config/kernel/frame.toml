[parts.frame]
name = "BC-IdeaTek-Frame"
folder = "kernel/frame"
uses = []
third_party = []

[parts.frame.package]
proof = "tests/kernel/frame/package/proof.c"
include = ["{bridge}/include"]

[compose.frame]
part = "frame"
from = "include/kernel/frame"
headers = ["*.h"]
into = "include"

[[artifact]]
name = "frame_layout"
kind = "program"
part = "frame"
test = true
sources = ["tests/kernel/frame/layout/layout.c"]
include = ["include/kernel/frame", "{bridge}/include"]

[[artifact]]
name = "frame_timer"
kind = "program"
part = "frame"
test = true
sources = ["tests/kernel/frame/timer/timer.c"]

[[artifact]]
name = "frame_probe"
kind = "native_module"
part = "frame"
test = true
sources = ["tests/kernel/frame/probe/probe.c"]
include = ["include/kernel/frame"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{space_probe_words}"]

[[artifact.variants]]
name = "frame_clock"
defines = ["ROLE_CLOCK"]
manifest = ["test:clock@1.0.0", "{space_probe_words}"]

[[artifact.variants]]
name = "frame_reader"
defines = ["ROLE_READER"]
manifest = ["test:reader@1.0.0", "{space_probe_words}"]

[[artifact.variants]]
name = "frame_table"
defines = ["ROLE_TABLE"]
manifest = ["test:reader@1.0.0", "{space_probe_words}"]

[[artifact.variants]]
name = "frame_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{space_probe_words}"]
