[parts.input]
name = "BC-IdeaTek-Input"
uses = ["world"]
third_party = []

[parts.input.package]
proof = "tests/input/package/proof.c"
include = ["{bridge}/include", "{root}/include/world"]

[compose.input]
part = "input"
from = "include/input"
headers = ["*.h"]
into = "include"

[variables]
input_probe_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=32768", "log_ring=512",
    "spans=65536", "spawns=none", "changes=16384", "persistent=none", "hot_reload=false",
]

input_spawn_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=32768", "log_ring=512",
    "spans=65536", "spawns=2", "changes=16384", "persistent=none", "hot_reload=false",
]

input_module_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=32768", "log_ring=512",
    "spans=65536", "spawns=2", "changes=16384", "persistent=16", "hot_reload=false",
]

[[artifact]]
name = "input_layout"
kind = "program"
part = "input"
test = true
sources = ["tests/input/layout/layout.c"]
include = ["include/input", "include/world", "{bridge}/include"]

[[artifact]]
name = "input_probe"
kind = "native_module"
part = "input"
test = true
sources = ["tests/input/probe/probe.c"]
include = ["include/input", "include/world"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{input_probe_words}"]


[[artifact.variants]]
name = "input_late"
defines = ["ROLE_LATE"]
manifest = ["test:probe@1.0.0", "{input_probe_words}"]

[[artifact.variants]]
name = "input_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{input_spawn_words}"]

[[artifact.variants]]
name = "input_module"
defines = ["ROLE_INPUT"]
manifest = ["test:input@1.0.0", "{input_module_words}"]

[[artifact.variants]]
name = "input_reader"
defines = ["ROLE_READER"]
manifest = ["test:reader@1.0.0", "{input_probe_words}"]
