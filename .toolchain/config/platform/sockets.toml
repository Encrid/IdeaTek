[parts.sockets]
name = "BC-IdeaTek-Sockets"
folder = "platform/sockets"
uses = ["world"]
third_party = []

[parts.sockets.package]
proof = "tests/platform/sockets/package/proof.c"
include = ["{bridge}/include", "{root}/include/platform/world"]

[compose.sockets]
part = "sockets"
from = "include/platform/sockets"
headers = ["*.h"]
into = "include"

[variables]
sockets_probe_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=8192", "log_ring=512",
    "spans=4096", "spawns=none", "changes=1024", "persistent=none", "hot_reload=false",
]

sockets_game_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=8192", "log_ring=512",
    "spans=4096", "spawns=1", "changes=1024", "persistent=64", "hot_reload=false",
]

sockets_module_words = [
    "abi=3", "config=none", "pinned=false", "reloadable=false", "scratch=8192", "log_ring=512",
    "spans=4096", "spawns=1", "changes=1024", "persistent=16", "hot_reload=false",
]

[[artifact]]
name = "sockets_layout"
kind = "program"
part = "sockets"
test = true
sources = ["tests/platform/sockets/layout/layout.c"]
include = ["include/platform/sockets", "include/platform/world", "{bridge}/include"]

[[artifact]]
name = "sockets_probe"
kind = "native_module"
part = "sockets"
test = true
sources = ["tests/platform/sockets/probe/probe.c"]
include = ["include/platform/sockets", "include/platform/world"]
defines = ["ROLE_ALL"]
manifest = ["test:probe@1.0.0", "{sockets_probe_words}"]

[[artifact.variants]]
name = "sockets_late"
defines = ["ROLE_LATE"]
manifest = ["test:probe@1.0.0", "{sockets_probe_words}"]

[[artifact.variants]]
name = "sockets_game"
defines = ["ROLE_GAME"]
manifest = ["test:game@1.0.0", "{sockets_game_words}"]

[[artifact.variants]]
name = "sockets_module"
defines = ["ROLE_SOCKETS"]
manifest = ["test:sockets@1.0.0", "{sockets_module_words}"]
