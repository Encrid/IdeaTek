[[case]]
name = "f64_get_atan2 gives the fixed NaN for a NaN in y"
run = ["{out}/math_probe{exe}", "f64_get_atan2", "nan", "0x1.0000000000000p+0"]
claims = { status = 0, line = ["f64_get_atan2 7ff8000000000000"] }
false = { run = ["{out}/math_probe{exe}", "f64_get_atan2", "0x1.0000000000000p+0", "0x1.0000000000000p+0"] }

