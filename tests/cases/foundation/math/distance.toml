[[case]]
name = "f64_get_sin is at most 1 unit in the last place from the sine of the C library on 20000 angles"
run = ["{out}/math_probe{exe}", "f64_distance", "sin", "1"]
claims = { status = 0, line = ["f64_distance sin within 1"] }
false = { run = ["{out}/math_probe{exe}", "f64_distance", "sin", "-1"] }

