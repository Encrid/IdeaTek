[[case]]
name = "f64_get_log of 1 is 0"
run = ["{out}/math_probe{exe}", "f64_get_log", "0x1.0000000000000p+0"]
claims = { status = 0, line = ["f64_get_log 0000000000000000"] }
false = { run = ["{out}/math_probe{exe}", "f64_get_log", "0x1.8000000000000p+0"] }

[[case]]
name = "f64_get_log of a number just below 1 uses the series near 1"
run = ["{out}/math_probe{exe}", "f64_get_log", "0x1.e666666666666p-1"]
claims = { status = 0, line = ["f64_get_log bfaa431d5bcc193e"] }
false = { run = ["{out}/math_probe{exe}", "f64_get_log", "0x1.eb851eb851eb8p-1"] }

