[[case]]
name = "f64_clamp gives a value between the bounds with no change"
run = ["{out}/math_probe{exe}", "f64_clamp", "0.5", "0", "1"]
claims = { status = 0, line = ["f64_clamp 3fe0000000000000"] }
false = { run = ["{out}/math_probe{exe}", "f64_clamp", "0.25", "0", "1"] }

[[case]]
name = "f64_clamp gives the low bound for a value below it"
run = ["{out}/math_probe{exe}", "f64_clamp", "-2", "0", "1"]
claims = { status = 0, line = ["f64_clamp 0000000000000000"] }
false = { run = ["{out}/math_probe{exe}", "f64_clamp", "0.5", "0", "1"] }

[[case]]
name = "f64_clamp gives the high bound for a value above it"
run = ["{out}/math_probe{exe}", "f64_clamp", "3", "0", "1"]
claims = { status = 0, line = ["f64_clamp 3ff0000000000000"] }
false = { run = ["{out}/math_probe{exe}", "f64_clamp", "0.5", "0", "1"] }

[[case]]
name = "f64_clamp gives a NaN for a value that is a NaN"
run = ["{out}/math_probe{exe}", "f64_clamp", "nan", "0", "1"]
claims = { status = 0, line = ["f64_clamp nan"] }
false = { run = ["{out}/math_probe{exe}", "f64_clamp", "0.5", "0", "1"] }

[[case]]
name = "f32_clamp gives a value between the bounds with no change"
run = ["{out}/math_probe{exe}", "f32_clamp", "0.5", "0", "1"]
claims = { status = 0, line = ["f32_clamp 3f000000"] }
false = { run = ["{out}/math_probe{exe}", "f32_clamp", "0.25", "0", "1"] }

[[case]]
name = "f32_clamp gives the low bound for a value below it"
run = ["{out}/math_probe{exe}", "f32_clamp", "-2", "0", "1"]
claims = { status = 0, line = ["f32_clamp 00000000"] }
false = { run = ["{out}/math_probe{exe}", "f32_clamp", "0.5", "0", "1"] }

[[case]]
name = "f32_clamp gives the high bound for a value above it"
run = ["{out}/math_probe{exe}", "f32_clamp", "3", "0", "1"]
claims = { status = 0, line = ["f32_clamp 3f800000"] }
false = { run = ["{out}/math_probe{exe}", "f32_clamp", "0.5", "0", "1"] }

[[case]]
name = "f64_blend gives the first value for a share of 0"
run = ["{out}/math_probe{exe}", "f64_blend", "1", "3", "0"]
claims = { status = 0, line = ["f64_blend 3ff0000000000000"] }
false = { run = ["{out}/math_probe{exe}", "f64_blend", "1", "3", "0.5"] }

[[case]]
name = "f64_blend gives the second value for a share of 1, also when the first value is much larger"
run = ["{out}/math_probe{exe}", "f64_blend", "10000000000000000", "1", "1"]
claims = { status = 0, line = ["f64_blend 3ff0000000000000"] }
false = { run = ["{out}/math_probe{exe}", "f64_blend", "10000000000000000", "1", "0"] }

[[case]]
name = "f64_blend gives the middle for a share of a half"
run = ["{out}/math_probe{exe}", "f64_blend", "1", "3", "0.5"]
claims = { status = 0, line = ["f64_blend 4000000000000000"] }
false = { run = ["{out}/math_probe{exe}", "f64_blend", "1", "3", "0.25"] }

[[case]]
name = "f64_blend joins no product and no sum inside a caller that is built with the fusion on"
run = ["{out}/math_probe{exe}", "f64_blend", "0x1.0000000000001p+0", "4503599627370498", "-0x1p-52"]
claims = { status = 0, line = ["f64_blend 0000000000000000"] }
false = { run = ["{out}/math_probe{exe}", "f64_blend", "0x1.0000000000001p+0", "4503599627370498", "0"] }

[[case]]
name = "f32_blend gives the first value for a share of 0"
run = ["{out}/math_probe{exe}", "f32_blend", "1", "3", "0"]
claims = { status = 0, line = ["f32_blend 3f800000"] }
false = { run = ["{out}/math_probe{exe}", "f32_blend", "1", "3", "0.5"] }

[[case]]
name = "f32_blend gives the middle for a share of a half"
run = ["{out}/math_probe{exe}", "f32_blend", "1", "3", "0.5"]
claims = { status = 0, line = ["f32_blend 40000000"] }
false = { run = ["{out}/math_probe{exe}", "f32_blend", "1", "3", "0.25"] }

[[case]]
name = "f64_is_finite gives true for a finite number"
run = ["{out}/math_probe{exe}", "f64_is_finite", "1"]
claims = { status = 0, line = ["f64_is_finite 1"] }
false = { run = ["{out}/math_probe{exe}", "f64_is_finite", "inf"] }

[[case]]
name = "f64_is_finite gives false for an infinity"
run = ["{out}/math_probe{exe}", "f64_is_finite", "-inf"]
claims = { status = 0, line = ["f64_is_finite 0"] }
false = { run = ["{out}/math_probe{exe}", "f64_is_finite", "1"] }

[[case]]
name = "f64_is_finite gives false for a NaN"
run = ["{out}/math_probe{exe}", "f64_is_finite", "nan"]
claims = { status = 0, line = ["f64_is_finite 0"] }
false = { run = ["{out}/math_probe{exe}", "f64_is_finite", "1"] }

[[case]]
name = "f32_is_finite gives true for a finite number"
run = ["{out}/math_probe{exe}", "f32_is_finite", "1"]
claims = { status = 0, line = ["f32_is_finite 1"] }
false = { run = ["{out}/math_probe{exe}", "f32_is_finite", "inf"] }

[[case]]
name = "f32_is_finite gives false for an infinity"
run = ["{out}/math_probe{exe}", "f32_is_finite", "inf"]
claims = { status = 0, line = ["f32_is_finite 0"] }
false = { run = ["{out}/math_probe{exe}", "f32_is_finite", "1"] }
