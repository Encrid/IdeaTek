claims = { status = 0, line = ["vec3f_store 3f800000 40000000 40400000 bf800000"] }
false = { run = ["{out}/math_probe{exe}", "vec3f_store", "1", "2", "4"] }

[[case]]
name = "vec3d_get_narrow rounds each part to the nearest number of 32 bits"
run = ["{out}/math_probe{exe}", "vec3d_get_narrow", "0x1.999999999999ap-4", "1", "16777217"]
claims = { status = 0, line = ["vec3d_get_narrow 3dcccccd 3f800000 4b800000"] }
false = { run = ["{out}/math_probe{exe}", "vec3d_get_narrow", "0x1.999999999999ap-4", "1", "16777218"] }

[[case]]
name = "vec3f_get_wide gives the same numbers in 64 bits"
run = ["{out}/math_probe{exe}", "vec3f_get_wide", "0x1.99999a0000000p-4", "1", "2"]
claims = { status = 0, line = ["vec3f_get_wide 3fb99999a0000000 3ff0000000000000 4000000000000000"] }
false = { run = ["{out}/math_probe{exe}", "vec3f_get_wide", "0x1.99999a0000000p-3", "1", "2"] }

[[case]]
name = "vec3d_split writes each part as a number of 32 bits and the rest of each part"
run = ["{out}/math_probe{exe}", "vec3d_split", "0x1.999999999999ap-4", "0x1.d6f34547df3b6p+26", "1"]
claims = { status = 0, line = ["vec3d_split 3dcccccd 4ceb79a3 3f800000 b0cccccd c03820c5 00000000"] }
false = { run = ["{out}/math_probe{exe}", "vec3d_split", "0x1.999999999999ap-3", "0x1.d6f34547df3b6p+26", "1"] }

[[case]]
name = "f64_split writes a number as a number of 32 bits and the rest"
run = ["{out}/math_probe{exe}", "f64_split", "0x1.d6f34547df3b6p+26"]
claims = { status = 0, line = ["f64_split 4ceb79a3 c03820c5"] }
false = { run = ["{out}/math_probe{exe}", "f64_split", "123456789.5"] }
