[[case]]
name = "vec3d_get_dot gives the sum of the 3 products"
run = ["{out}/math_probe{exe}", "vec3d_get_dot", "1", "2", "3", "4", "5", "6"]
claims = { status = 0, line = ["vec3d_get_dot 4040000000000000"] }
false = { run = ["{out}/math_probe{exe}", "vec3d_get_dot", "1", "2", "3", "4", "5", "7"] }

[[case]]
name = "vec3d_get_dot adds the products in the order x, y, z"
run = ["{out}/math_probe{exe}", "vec3d_get_dot", "9007199254740992", "1", "1", "1", "1", "1"]
claims = { status = 0, line = ["vec3d_get_dot 4340000000000000"] }
false = { run = ["{out}/math_probe{exe}", "vec3d_get_dot", "1", "1", "9007199254740992", "1", "1", "1"] }

[[case]]
name = "vec3d_get_dot joins no product and no sum inside a caller that is built with the fusion on"
run = ["{out}/math_probe{exe}", "vec3d_get_dot", "0x1.0000002p+0", "-0x1.0000004p+0", "0", "0x1.0000002p+0", "1", "0"]
claims = { status = 0, line = ["vec3d_get_dot 0000000000000000"] }
false = { run = ["{out}/math_probe{exe}", "vec3d_get_dot", "0x1.0000002p+0", "-0x1.0000004p+0", "0", "0x1.0000002p+0", "2", "0"] }

[[case]]
name = "vec3f_get_dot gives the sum of the 3 products"
run = ["{out}/math_probe{exe}", "vec3f_get_dot", "1", "2", "3", "4", "5", "6"]
claims = { status = 0, line = ["vec3f_get_dot 42000000"] }
false = { run = ["{out}/math_probe{exe}", "vec3f_get_dot", "1", "2", "3", "4", "5", "7"] }

[[case]]
name = "vec3f_get_dot adds the products in the order x, y, z"
run = ["{out}/math_probe{exe}", "vec3f_get_dot", "16777216", "1", "1", "1", "1", "1"]
claims = { status = 0, line = ["vec3f_get_dot 4b800000"] }
false = { run = ["{out}/math_probe{exe}", "vec3f_get_dot", "1", "1", "16777216", "1", "1", "1"] }

[[case]]
name = "vec3d_get_cross of the X axis and the Y axis is the Z axis"
run = ["{out}/math_probe{exe}", "vec3d_get_cross", "1", "0", "0", "0", "1", "0"]
claims = { status = 0, line = ["vec3d_get_cross 0000000000000000 0000000000000000 3ff0000000000000"] }
false = { run = ["{out}/math_probe{exe}", "vec3d_get_cross", "0", "1", "0", "1", "0", "0"] }

[[case]]
name = "vec3d_get_cross gives the cross product of 2 vectors"
run = ["{out}/math_probe{exe}", "vec3d_get_cross", "1", "2", "3", "4", "5", "6"]
claims = { status = 0, line = ["vec3d_get_cross c008000000000000 4018000000000000 c008000000000000"] }
false = { run = ["{out}/math_probe{exe}", "vec3d_get_cross", "1", "2", "3", "4", "5", "7"] }

[[case]]
name = "vec3f_get_cross gives the cross product of 2 vectors"
run = ["{out}/math_probe{exe}", "vec3f_get_cross", "1", "2", "3", "4", "5", "6"]
claims = { status = 0, line = ["vec3f_get_cross c0400000 40c00000 c0400000"] }
false = { run = ["{out}/math_probe{exe}", "vec3f_get_cross", "1", "2", "3", "4", "5", "7"] }

