false = { run = ["{out}/math_probe{exe}", "vec3f_get_unit", "4", "3", "0"] }

[[case]]
name = "vec3d_get_blend gives the middle of 2 vectors for a share of a half"
run = ["{out}/math_probe{exe}", "vec3d_get_blend", "1", "2", "3", "3", "4", "5", "0.5"]
claims = { status = 0, line = ["vec3d_get_blend 4000000000000000 4008000000000000 4010000000000000"] }
false = { run = ["{out}/math_probe{exe}", "vec3d_get_blend", "1", "2", "3", "3", "4", "5", "0.25"] }

[[case]]
name = "vec3d_get_blend gives the second vector for a share of 1, also when the first vector is much larger"
run = ["{out}/math_probe{exe}", "vec3d_get_blend", "10000000000000000", "10000000000000000", "10000000000000000", "1", "2", "3", "1"]
claims = { status = 0, line = ["vec3d_get_blend 3ff0000000000000 4000000000000000 4008000000000000"] }
false = { run = ["{out}/math_probe{exe}", "vec3d_get_blend", "10000000000000000", "10000000000000000", "10000000000000000", "1", "2", "3", "0"] }

[[case]]
name = "vec3f_get_blend gives the middle of 2 vectors for a share of a half"
run = ["{out}/math_probe{exe}", "vec3f_get_blend", "1", "2", "3", "3", "4", "5", "0.5"]
claims = { status = 0, line = ["vec3f_get_blend 40000000 40400000 40800000"] }
false = { run = ["{out}/math_probe{exe}", "vec3f_get_blend", "1", "2", "3", "3", "4", "5", "0.25"] }

