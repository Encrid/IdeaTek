claims = { status = 0, line = ["vec3d_load 3ff0000000000000 4000000000000000 4008000000000000"] }
false = { run = ["{out}/math_probe{exe}", "vec3d_load", "1", "2", "4"] }

[[case]]
name = "vec3d_store writes 3 plain numbers and leaves the fourth number as it is"
run = ["{out}/math_probe{exe}", "vec3d_store", "1", "2", "3"]
claims = { status = 0, line = ["vec3d_store 3ff0000000000000 4000000000000000 4008000000000000 bff0000000000000"] }
false = { run = ["{out}/math_probe{exe}", "vec3d_store", "1", "2", "4"] }

[[case]]
name = "vec3f_load reads 3 plain numbers at a pointer"
run = ["{out}/math_probe{exe}", "vec3f_load", "1", "2", "3"]
claims = { status = 0, line = ["vec3f_load 3f800000 40000000 40400000"] }
false = { run = ["{out}/math_probe{exe}", "vec3f_load", "1", "2", "4"] }

[[case]]
name = "vec3f_store writes 3 plain numbers and leaves the fourth number as it is"
