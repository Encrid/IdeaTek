claims = { status = 0, line = ["vec3f_get_distance 40a00000"] }
false = { run = ["{out}/math_probe{exe}", "vec3f_get_distance", "1", "2", "3", "4", "6", "4"] }

[[case]]
name = "vec3d_get_unit divides each part by the length"
run = ["{out}/math_probe{exe}", "vec3d_get_unit", "3", "4", "0"]
claims = { status = 0, line = ["vec3d_get_unit 3fe3333333333333 3fe999999999999a 0000000000000000"] }
false = { run = ["{out}/math_probe{exe}", "vec3d_get_unit", "4", "3", "0"] }

[[case]]
name = "vec3d_get_unit keeps a vector of length 0 at 0"
