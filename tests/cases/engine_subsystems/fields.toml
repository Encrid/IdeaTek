[[case]]
name = "the release of a target holds the header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "fields", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-Fields-{target}.zip", "include/ideatek_fields.h", "license",
    "package proof: BC-IdeaTek-Fields ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "fields"] }
