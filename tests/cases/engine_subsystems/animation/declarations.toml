[[case]]
name = "a module declares the 36 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/animation_probe{library}"] }

[case.folders]
"{case}/m" = ["animation_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:ideatek_vec3_t",
    "ideatek:ideatek_quat_t", "ideatek:ideatek_channel_property_t",
    "ideatek:ideatek_interpolation_t", "ideatek:ideatek_clip_channel_t",
    "ideatek:ideatek_clip_event_t", "ideatek:ideatek_repeat_t",
    "ideatek:ideatek_state_switch_t", "ideatek:ideatek_event_phase_t",
    "ideatek:ideatek_motion_axes_t", "ideatek:ideatek_axis_t",
    "ideatek:ideatek_collider_shape_t", "ideatek:Joint", "ideatek:Skin",
    "ideatek:SkinBinds", "ideatek:MorphWeights", "ideatek:Clip",
    "ideatek:AnimationTarget", "ideatek:AnimationPlayer", "ideatek:ClipPlay",
    "ideatek:BlendSpace", "ideatek:BlendPoint", "ideatek:AnimationStates",
    "ideatek:AnimationState", "ideatek:ClipEvent", "ideatek:RootMotion",
    "ideatek:RootMotionDelta", "ideatek:PoseModifier", "ideatek:TwoBoneIK",
    "ideatek:ChainIK", "ideatek:LookAt", "ideatek:CopyTransform",
    "ideatek:SpringChain", "ideatek:SpringCollider", "ideatek:PlayLink",
]
'''

[case.false.folders]
"{case}/m" = ["animation_late"]

