[[case]]
name = "a module declares the 23 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/navigation_probe{library}"] }

[case.folders]
"{case}/m" = ["navigation_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:ideatek_vec3_t",
    "ideatek:ideatek_position_t", "ideatek:ideatek_nav_build_t",
    "ideatek:ideatek_nav_area_flags_t", "ideatek:ideatek_nav_link_flags_t",
    "ideatek:ideatek_nav_query_kind_t", "ideatek:ideatek_nav_query_flags_t",
    "ideatek:ideatek_nav_result_t", "ideatek:ideatek_nav_point_t",
    "ideatek:ideatek_nav_agent_flags_t", "ideatek:ideatek_nav_steer_state_t",
    "ideatek:NavMesh", "ideatek:NavMeshState", "ideatek:NavArea",
    "ideatek:NavModifier", "ideatek:NavLink", "ideatek:NavQuery",
    "ideatek:NavPath", "ideatek:NavAgent", "ideatek:NavSteer",
    "ideatek:NavLinkReached", "ideatek:NavObstacle",
]
'''

[case.false.folders]
"{case}/m" = ["navigation_late"]

