[[case]]
name = "a module declares the 50 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/rendering_probe{library}"] }

[case.folders]
"{case}/m" = ["rendering_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:ideatek_vec3_t",
    "ideatek:ideatek_color_t", "ideatek:ideatek_rgb_t",
    "ideatek:ideatek_rect_t", "ideatek:ideatek_projection_kind_t",
    "ideatek:ideatek_topology_t", "ideatek:ideatek_index_format_t",
    "ideatek:ideatek_semantic_t", "ideatek:ideatek_mesh_stream_t",
    "ideatek:ideatek_submesh_t", "ideatek:ideatek_mesh_lod_t",
    "ideatek:ideatek_alpha_mode_t", "ideatek:ideatek_dimension_t",
    "ideatek:ideatek_filter_t", "ideatek:ideatek_wrap_t",
    "ideatek:ideatek_light_kind_t", "ideatek:ideatek_cast_shadow_t",
    "ideatek:ideatek_fog_shape_t", "ideatek:ideatek_sky_kind_t",
    "ideatek:ideatek_tonemap_curve_t", "ideatek:Camera", "ideatek:Projection",
    "ideatek:ProjectionAngles", "ideatek:Mesh", "ideatek:MeshInstance",
    "ideatek:MeshMaterials", "ideatek:Visibility", "ideatek:Affects",
    "ideatek:VisibilityRange", "ideatek:Material", "ideatek:Texture",
    "ideatek:Sampler", "ideatek:Light", "ideatek:Decal", "ideatek:Fog",
    "ideatek:Sky", "ideatek:Atmosphere", "ideatek:CloudLayer",
    "ideatek:Exposure", "ideatek:AutoExposure", "ideatek:Tonemap",
    "ideatek:Bloom", "ideatek:ColorGrade", "ideatek:DepthOfField",
    "ideatek:MotionBlur", "ideatek:Vignette", "ideatek:ChromaticAberration",
    "ideatek:FilmGrain", "ideatek:LensFlare",
]
'''

[case.false.folders]
"{case}/m" = ["rendering_late"]

