[[case]]
name = "a module declares the 6 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/subtitles_probe{library}"] }

[case.folders]
"{case}/m" = ["subtitles_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:ideatek_caption_kind_t",
    "ideatek:ideatek_subtitle_flags_t", "ideatek:SoundCaption",
    "ideatek:SubtitleLine", "ideatek:SubtitleSettings",
]
'''

[case.false.folders]
"{case}/m" = ["subtitles_late"]

[[case]]
