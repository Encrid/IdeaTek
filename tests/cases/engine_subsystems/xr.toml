[[case]]
name = "a module declares the 19 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/xr_probe{library}"] }

[case.folders]
"{case}/m" = ["xr_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_vec3_t", "ideatek:ideatek_xr_space_t",
    "ideatek:ideatek_xr_blend_t", "ideatek:ideatek_xr_session_state_t",
    "ideatek:ideatek_xr_blends_t", "ideatek:ideatek_xr_tracker_kind_t",
    "ideatek:ideatek_xr_hand_t", "ideatek:ideatek_xr_pose_t",
    "ideatek:ideatek_xr_location_t", "ideatek:XrOrigin", "ideatek:XrSession",
    "ideatek:XrTracker", "ideatek:XrPoseState", "ideatek:XrBindingPath",
    "ideatek:XrControlState", "ideatek:XrHand", "ideatek:XrJointState",
    "ideatek:XrHaptic", "ideatek:XrPlayArea",
]
'''

