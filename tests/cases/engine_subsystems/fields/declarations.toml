[[case]]
name = "a module declares the 5 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/fields_probe{library}"] }

[case.folders]
"{case}/m" = ["fields_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_vec3_t", "ideatek:ideatek_field_shape_t",
    "ideatek:ideatek_force_kind_t", "ideatek:Wind", "ideatek:ForceField",
]
'''

[case.false.folders]
"{case}/m" = ["fields_late"]

[[case]]
name = "an author loads with write on the wind and the force fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
