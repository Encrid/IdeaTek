[[case]]
name = "a module declares the 57 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/services_probe{library}"] }

[case.folders]
"{case}/m" = ["services_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:ideatek_service_state_t",
    "ideatek:ideatek_platform_t", "ideatek:ideatek_sign_status_t",
    "ideatek:ideatek_sign_in_flags_t", "ideatek:ideatek_ticket_purpose_t",
    "ideatek:ideatek_stat_mode_t", "ideatek:ideatek_score_method_t",
    "ideatek:ideatek_score_range_t", "ideatek:ideatek_friend_status_t",
    "ideatek:ideatek_joinable_t", "ideatek:ideatek_lobby_kind_t",
    "ideatek:ideatek_lobby_state_t", "ideatek:ideatek_compare_t",
    "ideatek:ideatek_voice_channel_flags_t", "ideatek:ideatek_store_flags_t",
    "ideatek:ideatek_ugc_state_t", "ideatek:PlatformUser", "ideatek:DeviceUser",
    "ideatek:SignInRequest", "ideatek:TicketRequest", "ideatek:Ticket",
    "ideatek:TicketCheck", "ideatek:TicketResult", "ideatek:AchievementState",
    "ideatek:AchievementProgress", "ideatek:StatState", "ideatek:StatUpdate",
    "ideatek:ScoreUpload", "ideatek:ScoreResult", "ideatek:ScoreQuery",
    "ideatek:ScoreEntry", "ideatek:CloudState", "ideatek:Friend",
    "ideatek:Presence", "ideatek:InviteRequest", "ideatek:JoinRequested",
    "ideatek:Lobby", "ideatek:LobbyJoin", "ideatek:LobbyState",
    "ideatek:LobbyMember", "ideatek:LobbyValue", "ideatek:LobbySet",
    "ideatek:LobbySearch", "ideatek:LobbyFilter", "ideatek:LobbyFound",
    "ideatek:VoiceChannel", "ideatek:VoiceMember", "ideatek:VoiceSettings",
    "ideatek:Entitlement", "ideatek:InstallRequest", "ideatek:StoreRequest",
    "ideatek:PlatformOverlay", "ideatek:UgcItem", "ideatek:UgcSubscribe",
    "ideatek:UgcPublish", "ideatek:UgcResult",
]
'''

[case.false.folders]
"{case}/m" = ["services_late"]

