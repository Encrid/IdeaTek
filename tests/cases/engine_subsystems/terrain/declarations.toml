[[case]]
name = "a module declares the 11 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/terrain_probe{library}"] }

[case.folders]
"{case}/m" = ["terrain_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:ideatek_vec3_t",
    "ideatek:ideatek_position_t", "ideatek:ideatek_terrain_flags_t",
    "ideatek:ideatek_terrain_shape_t", "ideatek:ideatek_terrain_op_t",
    "ideatek:Terrain", "ideatek:TerrainMaterial", "ideatek:TerrainChunk",
    "ideatek:TerrainEdit", "ideatek:TerrainFill",
]
'''

[case.false.folders]
"{case}/m" = ["terrain_late"]

