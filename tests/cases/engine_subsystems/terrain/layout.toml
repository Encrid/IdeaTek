[[case]]
name = "ideatek_terrain_flags_t is 1 byte"
run = ["{out}/terrain_layout{exe}", "terrain_flags"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/terrain_layout{exe}", "terrain"] }

[[case]]
name = "ideatek_terrain_t has the size, the alignment and the offsets of its Usage"
