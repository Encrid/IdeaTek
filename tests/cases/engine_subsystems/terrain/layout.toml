[[case]]
name = "the header compiles with the headers of the world and space parts and the headers of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/engine_subsystems/terrain", "-I", "include/platform_abstraction/world", "-I", "include/engine_subsystems/space", "-I", "{bridge}/include", "-c", "tests/engine_subsystems/terrain/layout/alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/engine_subsystems/terrain", "-I", "include/platform_abstraction/world", "-I", "include/engine_subsystems/space", "-c", "tests/engine_subsystems/terrain/layout/alone.c", "-o", "{case}/alone.o"] }
