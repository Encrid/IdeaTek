[[case]]
name = "the release of a target holds the header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "input_mapping", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-InputMapping-{target}.zip", "include/ideatek_input_mapping.h", "license",
    "package proof: BC-IdeaTek-InputMapping ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "input_mapping"] }
