[[case]]
name = "the release of a target holds the header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "web", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-Web-{target}.zip", "include/ideatek_web.h", "license",
    "package proof: BC-IdeaTek-Web ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "web"] }
