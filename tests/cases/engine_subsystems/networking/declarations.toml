[[case]]
name = "a module declares the 20 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/networking_probe{library}"] }

[case.folders]
"{case}/m" = ["networking_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:ideatek_net_role_t",
    "ideatek:ideatek_peer_state_t", "ideatek:ideatek_admit_t",
    "ideatek:ideatek_net_kind_t", "ideatek:ideatek_relevance_mode_t",
    "ideatek:NetSession", "ideatek:NetPeer", "ideatek:NetJoin",
    "ideatek:NetJoinEvent", "ideatek:NetAdmit", "ideatek:Replicated",
    "ideatek:NetEntity", "ideatek:NetOut", "ideatek:NetIn", "ideatek:NetViewer",
    "ideatek:NetRelevance", "ideatek:NetCommand", "ideatek:NetCommandIn",
    "ideatek:NetSessionState",
]
'''

[case.false.folders]
"{case}/m" = ["networking_late"]

