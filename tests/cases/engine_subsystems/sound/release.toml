[[case]]
name = "the release of a target holds the header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "sound", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-Sound-{target}.zip", "include/ideatek_sound.h", "license",
    "package proof: BC-IdeaTek-Sound ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "sound"] }
