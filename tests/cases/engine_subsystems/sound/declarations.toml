[[case]]
name = "a module declares the 40 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/sound_probe{library}"] }

[case.folders]
"{case}/m" = ["sound_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:ideatek_sound_format_t",
    "ideatek:ideatek_sound_flags_t", "ideatek:ideatek_sound_state_t",
    "ideatek:ideatek_sound_player_flags_t", "ideatek:ideatek_attenuation_t",
    "ideatek:ideatek_spatial_flags_t", "ideatek:ideatek_bus_flags_t",
    "ideatek:ideatek_effect_flags_t", "ideatek:ideatek_filter_mode_t",
    "ideatek:ideatek_voice_rule_t", "ideatek:ideatek_clock_flags_t",
    "ideatek:ideatek_quantum_t", "ideatek:Sound", "ideatek:SoundPlayer",
    "ideatek:SoundPlayback", "ideatek:SoundEnded", "ideatek:SoundSpatial",
    "ideatek:SoundListener", "ideatek:SoundBus", "ideatek:SoundEffect",
    "ideatek:SoundFilter", "ideatek:SoundCompressor", "ideatek:SoundLimiter",
    "ideatek:SoundReverb", "ideatek:SoundDelay", "ideatek:SoundZone",
    "ideatek:SoundMaterial", "ideatek:SoundGroup", "ideatek:SoundVoice",
    "ideatek:SoundStream", "ideatek:SoundFrames", "ideatek:SoundStreamState",
    "ideatek:SoundClock", "ideatek:SoundSync", "ideatek:SoundBeat",
    "ideatek:SoundMeter", "ideatek:SoundLevel", "ideatek:SoundBand",
    "ideatek:SoundBandLevel",
]
'''

[case.false.folders]
"{case}/m" = ["sound_late"]

