]
'''

[[case]]
name = "the release of a target holds the header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "rendering", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-Rendering-{target}.zip", "include/ideatek_rendering.h", "license",
    "package proof: BC-IdeaTek-Rendering ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "rendering"] }
