    "ideatek:Exposure", "ideatek:AutoExposure", "ideatek:Tonemap",
    "ideatek:Bloom", "ideatek:ColorGrade", "ideatek:DepthOfField",
    "ideatek:MotionBlur", "ideatek:Vignette", "ideatek:ChromaticAberration",
    "ideatek:FilmGrain", "ideatek:LensFlare", "ideatek:MaterialClearcoat",
