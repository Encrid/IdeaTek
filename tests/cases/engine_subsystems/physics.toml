[[case]]
name = "the render module loads with read on the hidden joints, the water, the liquids and the smoke"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:renderer@1.0.0, native, m/physics_renderer{library}"] }

[case.folders]
"{case}/m" = ["physics_renderer"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:renderer@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:ideatek_vec3_t", "ideatek:HiddenJoint",
    "ideatek:Water", "ideatek:Wave", "ideatek:LiquidParticles",
    "ideatek:LiquidFoam", "ideatek:SmokeGrid",
]
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:renderer@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:ideatek_vec3_t", "ideatek:HiddenJoint",
    "ideatek:Water", "ideatek:Wave", "ideatek:LiquidParticles",
    "ideatek:LiquidFoam",
]
'''

[[case]]
name = "the release of a target holds the header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "physics", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-Physics-{target}.zip", "include/ideatek_physics.h", "license",
    "package proof: BC-IdeaTek-Physics ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "physics"] }
