[[case]]
name = "a module declares the 5 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/web_probe{library}"] }

[case.folders]
"{case}/m" = ["web_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_web_method_t", "ideatek:ideatek_web_state_t",
    "ideatek:ideatek_web_error_t", "ideatek:WebRequest", "ideatek:WebResponse",
]
'''

[case.false.folders]
"{case}/m" = ["web_late"]

[[case]]
