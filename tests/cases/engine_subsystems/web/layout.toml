[[case]]
name = "ideatek_web_method_t is 1 byte"
run = ["{out}/web_layout{exe}", "web_method"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/web_layout{exe}", "web_request"] }

[[case]]
name = "ideatek_web_request_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/web_layout{exe}", "web_request"]
claims = { status = 0, order = ["size 36", "alignment 4", "url 0", "headers 8", "body 16", "timeout 24", "max_redirects 28", "method 32"] }
false = { run = ["{out}/web_layout{exe}", "web_state"] }

[[case]]
name = "ideatek_web_state_t is 1 byte"
run = ["{out}/web_layout{exe}", "web_state"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/web_layout{exe}", "web_response"] }

[[case]]
name = "ideatek_web_error_t is 1 byte"
run = ["{out}/web_layout{exe}", "web_error"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/web_layout{exe}", "web_response"] }

[[case]]
name = "ideatek_web_response_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/web_layout{exe}", "web_response"]
claims = { status = 0, order = ["size 20", "alignment 4", "headers 0", "body 8", "status 16", "state 18", "error 19"] }
false = { run = ["{out}/web_layout{exe}", "web_method"] }

[[case]]
name = "each descriptor holds the bytes of its Usage"
run = ["{out}/web_layout{exe}", "descriptors"]
claims = { status = 0, line = [
    "uint8_t { IDEATEK_WEB_METHOD_GET = 0, IDEATEK_WEB_METHOD_HEAD = 1, IDEATEK_WEB_METHOD_POST = 2, IDEATEK_WEB_METHOD_PUT = 3, IDEATEK_WEB_METHOD_DELETE = 4, IDEATEK_WEB_METHOD_PATCH = 5 }",
    "{ bridge_text_t url; bridge_text_t headers; bridge_text_t body; float timeout; uint32_t max_redirects; ideatek_web_method_t method; }",
    "uint8_t { IDEATEK_WEB_STATE_PENDING = 0, IDEATEK_WEB_STATE_DONE = 1, IDEATEK_WEB_STATE_FAILED = 2 }",
    "uint8_t { IDEATEK_WEB_ERROR_NONE = 0, IDEATEK_WEB_ERROR_RESOLVE = 1, IDEATEK_WEB_ERROR_CONNECT = 2, IDEATEK_WEB_ERROR_TLS = 3, IDEATEK_WEB_ERROR_TIMEOUT = 4, IDEATEK_WEB_ERROR_TOO_BIG = 5 }",
    "{ bridge_text_t headers; bridge_text_t body; uint16_t status; ideatek_web_state_t state; ideatek_web_error_t error; }",
] }
false = { run = ["{out}/web_layout{exe}", "texts"] }

[[case]]
name = "each macro of a text gives the braces of its type and the text between them"
run = ["{out}/web_layout{exe}", "texts"]
claims = { status = 0, line = [
    "{ IDEATEK_WEB_METHOD_GET = 0, IDEATEK_WEB_METHOD_HEAD = 1, IDEATEK_WEB_METHOD_POST = 2, IDEATEK_WEB_METHOD_PUT = 3, IDEATEK_WEB_METHOD_DELETE = 4, IDEATEK_WEB_METHOD_PATCH = 5 }",
    "{ bridge_text_t url; bridge_text_t headers; bridge_text_t body; float timeout; uint32_t max_redirects; ideatek_web_method_t method; }",
    "{ IDEATEK_WEB_STATE_PENDING = 0, IDEATEK_WEB_STATE_DONE = 1, IDEATEK_WEB_STATE_FAILED = 2 }",
    "{ IDEATEK_WEB_ERROR_NONE = 0, IDEATEK_WEB_ERROR_RESOLVE = 1, IDEATEK_WEB_ERROR_CONNECT = 2, IDEATEK_WEB_ERROR_TLS = 3, IDEATEK_WEB_ERROR_TIMEOUT = 4, IDEATEK_WEB_ERROR_TOO_BIG = 5 }",
    "{ bridge_text_t headers; bridge_text_t body; uint16_t status; ideatek_web_state_t state; ideatek_web_error_t error; }",
] }
false = { run = ["{out}/web_layout{exe}", "descriptors"] }

[[case]]
name = "the header compiles with its own folder and the headers of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/engine_subsystems/web", "-I", "{bridge}/include", "-c", "tests/engine_subsystems/web/layout/alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/engine_subsystems/web", "-c", "tests/engine_subsystems/web/layout/alone.c", "-o", "{case}/alone.o"] }
