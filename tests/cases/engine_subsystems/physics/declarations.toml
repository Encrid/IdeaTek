[[case]]
name = "a module declares the 59 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/physics_probe{library}"] }

[case.folders]
"{case}/m" = ["physics_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:ideatek_vec3_t",
    "ideatek:ideatek_quat_t", "ideatek:ideatek_position_t",
    "ideatek:ideatek_body_kind_t", "ideatek:ideatek_mass_mode_t",
    "ideatek:ideatek_locked_t", "ideatek:ideatek_body_flags_t",
    "ideatek:ideatek_shape_kind_t", "ideatek:ideatek_shape_flags_t",
    "ideatek:ideatek_combine_t", "ideatek:ideatek_touch_kind_t",
    "ideatek:ideatek_query_kind_t", "ideatek:ideatek_query_mode_t",
    "ideatek:ideatek_joint_flags_t", "ideatek:ideatek_joint_features_t",
    "ideatek:ideatek_wheel_flags_t", "ideatek:ideatek_rope_flags_t",
    "ideatek:ideatek_liquid_flags_t", "ideatek:Body", "ideatek:Motion",
    "ideatek:Push", "ideatek:Shape", "ideatek:PhysicsMaterial",
    "ideatek:SensorEvent", "ideatek:ContactEvent", "ideatek:HitEvent",
    "ideatek:Query", "ideatek:QueryHit", "ideatek:BodyJoint",
    "ideatek:FixedJoint", "ideatek:PointJoint", "ideatek:HingeJoint",
    "ideatek:SliderJoint", "ideatek:DistanceJoint", "ideatek:SwingTwistJoint",
    "ideatek:SixDofJoint", "ideatek:BodyJointEvent", "ideatek:Vehicle",
    "ideatek:Wheel", "ideatek:VehicleInput", "ideatek:WheelState",
    "ideatek:PoseDrive", "ideatek:Destructible", "ideatek:Damage",
    "ideatek:BreakEvent", "ideatek:HiddenJoint", "ideatek:Cut",
    "ideatek:CutEvent", "ideatek:SoftBody", "ideatek:SoftBodyReset",
    "ideatek:Rope", "ideatek:Water", "ideatek:Wave", "ideatek:WaterSample",
    "ideatek:Buoyancy", "ideatek:Liquid", "ideatek:LiquidEmitter",
    "ideatek:LagHistory",
]
'''

[case.false.folders]
"{case}/m" = ["physics_late"]

