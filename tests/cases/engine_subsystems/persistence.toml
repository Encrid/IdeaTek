claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/engine_subsystems", "-I", "include/platform_abstraction", "-c", "tests/engine_subsystems/persistence_alone.c", "-o", "{case}/alone.o"] }

[[case]]
name = "a module declares the 10 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/persistence_probe{library}"] }

[case.folders]
"{case}/m" = ["persistence_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:ideatek_save_action_t",
    "ideatek:ideatek_save_state_t", "ideatek:ideatek_save_error_t",
    "ideatek:SaveRequest", "ideatek:Saved", "ideatek:SaveReady",
    "ideatek:SaveRefuse", "ideatek:SaveResult", "ideatek:SaveInfo",
]
'''

[case.false.folders]
"{case}/m" = ["persistence_late"]

