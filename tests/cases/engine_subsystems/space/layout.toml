[[case]]
name = "each descriptor holds the bytes of its Usage"
run = ["{out}/space_layout{exe}", "descriptors"]
claims = { status = 0, line = [
    "{ float x; float y; float z; }",
    "{ float x; float y; float z; float w; }",
    "{ double x; double y; double z; }",
    "uint8_t { IDEATEK_KEEP_LOCAL = 0, IDEATEK_KEEP_WORLD = 1 }",
    "uint8_t { IDEATEK_ORPHAN_DESTROY = 0, IDEATEK_ORPHAN_KEEP_WORLD = 1 }",
    "{ ideatek_position_t position; ideatek_quat_t rotation; ideatek_vec3_t scale; }",
    "{ ideatek_entity_t entity; int32_t order; ideatek_keep_t keep; ideatek_orphan_t orphan; uint8_t absolute; }",
    "{ ideatek_position_t origin; float basis[9]; }",
    "{ ideatek_entity_t first; ideatek_entity_t last; uint32_t count; }",
    "{ ideatek_entity_t prev; ideatek_entity_t next; }",
    "{ ideatek_world_transform_t world; uint64_t tick; }",
] }
false = { run = ["{out}/space_layout{exe}", "texts"] }

[[case]]
name = "each macro of a text gives the braces of its type and the text between them"
run = ["{out}/space_layout{exe}", "texts"]
claims = { status = 0, line = [
    "{ float x; float y; float z; }",
    "{ float x; float y; float z; float w; }",
    "{ double x; double y; double z; }",
    "{ IDEATEK_KEEP_LOCAL = 0, IDEATEK_KEEP_WORLD = 1 }",
    "{ IDEATEK_ORPHAN_DESTROY = 0, IDEATEK_ORPHAN_KEEP_WORLD = 1 }",
    "{ ideatek_position_t position; ideatek_quat_t rotation; ideatek_vec3_t scale; }",
    "{ ideatek_entity_t entity; int32_t order; ideatek_keep_t keep; ideatek_orphan_t orphan; uint8_t absolute; }",
    "{ ideatek_position_t origin; float basis[9]; }",
    "{ ideatek_entity_t first; ideatek_entity_t last; uint32_t count; }",
    "{ ideatek_entity_t prev; ideatek_entity_t next; }",
    "{ ideatek_world_transform_t world; uint64_t tick; }",
] }
false = { run = ["{out}/space_layout{exe}", "descriptors"] }

[[case]]
name = "the header compiles with the headers of the world part and of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/engine_subsystems/space", "-I", "include/platform_abstraction/world", "-I", "{bridge}/include", "-c", "tests/engine_subsystems/space/layout/alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/engine_subsystems/space", "-I", "include/platform_abstraction/world", "-c", "tests/engine_subsystems/space/layout/alone.c", "-o", "{case}/alone.o"] }
