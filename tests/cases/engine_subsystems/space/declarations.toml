[[case]]
name = "a module declares the 15 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/space_probe{library}"] }

[case.folders]
"{case}/m" = ["space_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_vec3_t", "ideatek:ideatek_quat_t", "ideatek:ideatek_position_t", "ideatek:ideatek_entity_t",
    "ideatek:ideatek_keep_t", "ideatek:ideatek_orphan_t", "ideatek:ideatek_world_transform_t",
    "ideatek:Transform", "ideatek:Parent", "ideatek:WorldTransform", "ideatek:Children", "ideatek:Sibling",
    "ideatek:PreviousWorldTransform", "ideatek:Interpolated", "ideatek:Teleported",
]
'''

[case.false.folders]
"{case}/m" = ["space_late"]

