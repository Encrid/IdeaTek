[[case]]
name = "each descriptor holds the bytes of its Usage"
run = ["{out}/debug_draw_layout{exe}", "descriptors"]
claims = { status = 0, line = [
    "uint8_t { IDEATEK_DEBUG_KIND_LINE = 0, IDEATEK_DEBUG_KIND_POINT = 1, IDEATEK_DEBUG_KIND_BOX = 2, IDEATEK_DEBUG_KIND_SPHERE = 3, IDEATEK_DEBUG_KIND_CAPSULE = 4, IDEATEK_DEBUG_KIND_ARROW = 5, IDEATEK_DEBUG_KIND_AXES = 6, IDEATEK_DEBUG_KIND_TEXT = 7, IDEATEK_DEBUG_KIND_TRIANGLE = 8, IDEATEK_DEBUG_KIND_CYLINDER = 9, IDEATEK_DEBUG_KIND_CONE = 10, IDEATEK_DEBUG_KIND_CIRCLE = 11, IDEATEK_DEBUG_KIND_MESH = 12 }",
    "uint8_t { IDEATEK_DEBUG_FLAGS_ON_TOP = 0x01, IDEATEK_DEBUG_FLAGS_SCREEN = 0x02, IDEATEK_DEBUG_FLAGS_SOLID = 0x04, IDEATEK_DEBUG_FLAGS_CAST_SHADOW = 0x08 }",
    "{ uint64_t groups; bridge_text_t data; }",
    "{ uint64_t groups; }",
] }
false = { run = ["{out}/debug_draw_layout{exe}", "texts"] }

[[case]]
