[[case]]
name = "ideatek_debug_kind_t is 1 byte"
run = ["{out}/debug_draw_layout{exe}", "debug_kind"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/debug_draw_layout{exe}", "debug_draw"] }

[[case]]
name = "ideatek_debug_flags_t is 1 byte"
