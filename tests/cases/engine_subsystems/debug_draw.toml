[[case]]
name = "the header compiles with its own folder and the headers of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/engine_subsystems", "-I", "{bridge}/include", "-c", "tests/engine_subsystems/debug_draw_alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/engine_subsystems", "-c", "tests/engine_subsystems/debug_draw_alone.c", "-o", "{case}/alone.o"] }

[[case]]
name = "a module declares the 4 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/debug_draw_probe{library}"] }

[case.folders]
"{case}/m" = ["debug_draw_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_debug_kind_t", "ideatek:ideatek_debug_flags_t",
    "ideatek:DebugDraw", "ideatek:DebugView",
]
'''

[case.false.folders]
"{case}/m" = ["debug_draw_late"]

