[[case]]
name = "each descriptor holds the bytes of its Usage"
run = ["{out}/xr_layout{exe}", "descriptors"]
claims = { status = 0, line = [
    "uint8_t { IDEATEK_XR_SPACE_LOCAL = 0, IDEATEK_XR_SPACE_STAGE = 1, IDEATEK_XR_SPACE_LOCAL_FLOOR = 2 }",
    "uint8_t { IDEATEK_XR_BLEND_OPAQUE = 1, IDEATEK_XR_BLEND_ADDITIVE = 2, IDEATEK_XR_BLEND_ALPHA_BLEND = 3 }",
    "{ float scale; ideatek_xr_space_t space; ideatek_xr_blend_t blend; }",
    "uint8_t { IDEATEK_XR_SESSION_STATE_UNKNOWN = 0, IDEATEK_XR_SESSION_STATE_IDLE = 1, IDEATEK_XR_SESSION_STATE_READY = 2, IDEATEK_XR_SESSION_STATE_SYNCHRONIZED = 3, IDEATEK_XR_SESSION_STATE_VISIBLE = 4, IDEATEK_XR_SESSION_STATE_FOCUSED = 5, IDEATEK_XR_SESSION_STATE_STOPPING = 6, IDEATEK_XR_SESSION_STATE_LOSS_PENDING = 7, IDEATEK_XR_SESSION_STATE_EXITING = 8 }",
    "uint8_t { IDEATEK_XR_BLENDS_OPAQUE = 0x02, IDEATEK_XR_BLENDS_ADDITIVE = 0x04, IDEATEK_XR_BLENDS_ALPHA_BLEND = 0x08 }",
    "{ float refresh; ideatek_xr_session_state_t state; ideatek_xr_blend_t blend; ideatek_xr_blends_t blends; }",
    "uint8_t { IDEATEK_XR_TRACKER_KIND_HEAD = 0, IDEATEK_XR_TRACKER_KIND_CONTROLLER = 1, IDEATEK_XR_TRACKER_KIND_TRACKER = 2 }",
    "uint8_t { IDEATEK_XR_HAND_UNKNOWN = 0, IDEATEK_XR_HAND_LEFT = 1, IDEATEK_XR_HAND_RIGHT = 2 }",
    "uint8_t { IDEATEK_XR_POSE_GRIP = 0, IDEATEK_XR_POSE_AIM = 1 }",
    "{ ideatek_xr_tracker_kind_t kind; ideatek_xr_hand_t hand; ideatek_xr_pose_t pose; }",
    "uint8_t { IDEATEK_XR_LOCATION_ORIENTATION_VALID = 0x01, IDEATEK_XR_LOCATION_POSITION_VALID = 0x02, IDEATEK_XR_LOCATION_ORIENTATION_TRACKED = 0x04, IDEATEK_XR_LOCATION_POSITION_TRACKED = 0x08 }",
    "{ ideatek_vec3_t linear; ideatek_vec3_t angular; ideatek_xr_location_t flags; }",
    "{ bridge_text_t profile; bridge_text_t path; }",
    "{ float x; float y; bool active; }",
    "{ ideatek_xr_hand_t hand; bool active; }",
    "{ float radius; ideatek_xr_location_t flags; }",
    "{ float amplitude; float frequency; uint32_t duration_ms; }",
    "{ float width; float depth; }",
] }
false = { run = ["{out}/xr_layout{exe}", "texts"] }

