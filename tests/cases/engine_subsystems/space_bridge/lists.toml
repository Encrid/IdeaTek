[[case]]
name = "the children are in the order of order, then of their ids, with their links"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["r4 children 0 first 2 last 1 count 3", "r4 sibling 2 prev -1 next 3 parent 0", "r4 sibling 3 prev 2 next 1 parent 0", "r4 sibling 1 prev 3 next -1 parent 0"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_space.toml"]
rounds = 7
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
[module."test:game@1.0.0".config]
script = "1:node 0,0,0|2:child 0,1,0,0,0,0,0,0|2:child 0,2,0,0,1,0,0,0|2:child 0,3,0,0,1,0,0,0|4:show_space"
''' } }

