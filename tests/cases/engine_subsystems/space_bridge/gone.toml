[[case]]
name = "an entity that loses its transform loses its place"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["r5 world 0 none and no transform"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_space.toml"]
rounds = 7
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
[module."test:game@1.0.0".config]
script = "1:node 1,0,0|5:show_space"
''' } }

[case.folders]
"{case}/m" = ["frame_sdl3", "window_sdl3", "space_bridge", "sdl3_game_space", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_space.toml"]
rounds = 7
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
[module."test:game@1.0.0".config]
script = "1:node 1,0,0|3:untransform 0|5:show_space"
'''

[[case]]
name = "the children of a parent that loses its transform take their own transforms as their places"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["r6 world 1 at 1.000 0.000 0.000", "r6 children 0 first 1 last 1 count 1"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_space.toml"]
rounds = 7
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
[module."test:game@1.0.0".config]
script = "1:node 5,0,0|2:child 0,1,0,0,0,0,0,0|6:show_space"
''' } }

[case.folders]
"{case}/m" = ["frame_sdl3", "window_sdl3", "space_bridge", "sdl3_game_space", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_space.toml"]
rounds = 7
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
[module."test:game@1.0.0".config]
script = "1:node 5,0,0|2:child 0,1,0,0,0,0,0,0|4:untransform 0|6:show_space"
'''
