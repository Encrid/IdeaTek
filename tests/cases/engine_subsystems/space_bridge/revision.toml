[[case]]
name = "the first place of an entity gives revision 1, and 2 moves give revision 3"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["r3 world 0 at 1.000 2.000 4.000 x 1.000 0.000 0.000 rev 1", "r8 world 0 at 3.000 2.000 4.000 x 1.000 0.000 0.000 rev 3"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_space.toml"]
rounds = 9
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
[module."test:game@1.0.0".config]
script = "1:node 1,2,4|3:show_space|4:move 0,2,2,4|6:move 0,2,2,4|8:show_space"
''' } }

[case.folders]
"{case}/m" = ["frame_sdl3", "window_sdl3", "space_bridge", "sdl3_game_space", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_space.toml"]
rounds = 9
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
[module."test:game@1.0.0".config]
script = "1:node 1,2,4|3:show_space|4:move 0,2,2,4|6:move 0,3,2,4|8:show_space"
'''

