[[case]]
name = "ideatek_audio.h compiles with the headers of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/audio", "-I", "include/world", "-I", "{bridge}/include", "-c", "tests/audio/layout/alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/audio", "-I", "include/world", "-c", "tests/audio/layout/alone.c", "-o", "{case}/alone.o"] }
