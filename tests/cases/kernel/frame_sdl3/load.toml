[[case]]
name = "the clock module loads with the window module and the game, and the first round gives index 1"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["loaded: ideatek_frame_sdl3:clock@0.1.0", "r1 frame 1 delta 0.000000 elapsed 0.000000 real 0.000000 0.000000 scale 1.00 paused 0"] }
false = { folders = { "{case}/m" = ["window_sdl3", "sdl3_game_frame", "SDL3_test"] } }

[case.folders]
"{case}/m" = ["frame_sdl3", "window_sdl3", "sdl3_game_frame", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_frame.toml"]
rounds = 2
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
[module."test:game@1.0.0".config]
script = "1:show_frame"
'''

[[case]]
name = "a reload gives 0, because the module is not reloadable"
run = ["{out}/frame_sdl3_reload{exe}", "reload"]
claims = { status = 0, line = ["reload 0"] }
false = { run = ["{out}/frame_sdl3_reload{exe}", "shutdown"] }
