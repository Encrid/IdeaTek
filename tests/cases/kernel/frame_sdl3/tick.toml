[[case]]
name = "each step of the fixed phase advances tick and the elapsed of the tick"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["step 1 0.015625", "step 2 0.031250", "step 3 0.046875", "step 4 0.062500", "r3 tick 4 elapsed 0.062500 step 0.015625 steps 2 fraction 0.0000"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_frame.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
fixed_round = 0.015625
[module."test:game@1.0.0".config]
script = "3:show_tick"
''' } }

[case.folders]
"{case}/m" = ["frame_sdl3", "window_sdl3", "sdl3_game_frame", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_frame.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
fixed_round = 0.03125
[module."test:game@1.0.0".config]
script = "3:show_tick"
'''

[[case]]
name = "a round with no step runs the fixed phase 1 time with no step"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["r2 tick 0 elapsed 0.000000 step 0.015625 steps 0 fraction 0.5000", "r3 tick 1 elapsed 0.015625 step 0.015625 steps 1 fraction 0.0000"], matches_not = ["step 0 "] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_frame.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
fixed_round = 0.015625
[module."test:game@1.0.0".config]
script = "2:show_tick|3:show_tick"
''' } }

[case.folders]
"{case}/m" = ["frame_sdl3", "window_sdl3", "sdl3_game_frame", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_frame.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
fixed_round = 0.0078125
[module."test:game@1.0.0".config]
script = "2:show_tick|3:show_tick"
'''
