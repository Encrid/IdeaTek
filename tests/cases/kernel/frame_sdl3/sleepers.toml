[[case]]
name = "sleeper clock with a max_rate of 20 makes 4 rounds wait at least 160 ms"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, matches = ["r6 span (1[6-9][0-9]|[2-9][0-9][0-9]|[0-9]{4,}) "] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_frame.toml"]
rounds = 6
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:timereq 1,64,0,0|2:mark|6:span"
''' } }

[case.folders]
"{case}/m" = ["frame_sdl3", "window_sdl3", "sdl3_game_frame", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_frame.toml"]
rounds = 6
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:timereq 1,64,20,0|2:mark|6:span"
'''

[[case]]
name = "sleeper events with a window makes the window module wait at least 160 ms for 4 rounds"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, matches = ["r7 span (1[6-9][0-9]|[2-9][0-9][0-9]|[0-9]{4,}) "] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_frame.toml"]
rounds = 7
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
sleeper = "events"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|1:timereq 1,64,0,0|3:mark|7:span"
''' } }

