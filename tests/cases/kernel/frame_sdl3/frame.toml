[[case]]
name = "each round after the first adds fixed_round to the elapsed times"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["r1 frame 1 delta 0.000000 elapsed 0.000000 real 0.000000 0.000000 scale 1.00 paused 0", "r4 frame 4 delta 0.015625 elapsed 0.046875 real 0.015625 0.046875 scale 1.00 paused 0"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_frame.toml"]
rounds = 4
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
fixed_round = 0.03125
[module."test:game@1.0.0".config]
script = "1:show_frame|4:show_frame"
''' } }

