[[case]]
name = "ideatek_load_state_t has the size and the alignment of its Usage"
run = ["{out}/resources_layout{exe}", "state"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/resources_layout{exe}", "load"] }

