[[case]]
name = "the header compiles with the headers of the world part and of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/kernel/resources", "-I", "include/platform_abstraction/world", "-I", "{bridge}/include", "-c", "tests/kernel/resources/layout/alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/kernel/resources", "-I", "include/platform_abstraction/world", "-c", "tests/kernel/resources/layout/alone.c", "-o", "{case}/alone.o"] }
