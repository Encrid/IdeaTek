[[case]]
name = "each descriptor holds the bytes of its Usage"
run = ["{out}/resources_layout{exe}", "descriptors"]
claims = { status = 0, line = [
    "uint8_t { IDEATEK_LOAD_STATE_NOT_LOADED = 0, IDEATEK_LOAD_STATE_LOADING = 1, IDEATEK_LOAD_STATE_LOADED = 2, IDEATEK_LOAD_STATE_FAILED = 3 }",
    "uint8_t { IDEATEK_RESOURCE_ERROR_NONE = 0, IDEATEK_RESOURCE_ERROR_NO_LOADER = 1, IDEATEK_RESOURCE_ERROR_TWO_LOADERS = 2, IDEATEK_RESOURCE_ERROR_NOT_FOUND = 3, IDEATEK_RESOURCE_ERROR_READ_FAILED = 4, IDEATEK_RESOURCE_ERROR_LOADER_FAILED = 5, IDEATEK_RESOURCE_ERROR_NO_LABEL = 6, IDEATEK_RESOURCE_ERROR_WRONG_TYPE = 7, IDEATEK_RESOURCE_ERROR_IGNORED = 8, IDEATEK_RESOURCE_ERROR_TOO_BIG = 9 }",
    "{ ideatek_entity_t owner; bridge_text_t path; bridge_text_t type; bridge_text_t settings; uint8_t reload_owner; }",
    "{ ideatek_entity_t resource; }",
    "{ bridge_text_t path; bridge_text_t type; ideatek_load_state_t state; ideatek_load_state_t dependencies; ideatek_load_state_t recursive; ideatek_resource_error_t error; }",
    "{ bridge_text_t name; bridge_text_t type; bridge_text_t extensions; }",
    "{ ideatek_entity_t loader; bridge_text_t data; bridge_text_t settings; }",
    "{ ideatek_resource_error_t error; }",
    "{ ideatek_entity_t resource; bridge_text_t label; }",
] }
false = { run = ["{out}/resources_layout{exe}", "texts"] }

[[case]]
name = "each macro of a text gives the braces of its type and the text between them"
run = ["{out}/resources_layout{exe}", "texts"]
