[[case]]
name = "the release of a target holds the header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "frame", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-Frame-{target}.zip", "include/ideatek_frame.h", "license",
    "package proof: BC-IdeaTek-Frame ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "frame"] }
