[[case]]
name = "a timer that runs 1 time is done when the elapsed time reaches its deadline"
run = ["{out}/frame_timer{exe}", "once"]
claims = { status = 0, line = ["done 0 0 1 1"] }
false = { run = ["{out}/frame_timer{exe}", "repeat"] }

[[case]]
name = "a timer that repeats gives each finish once, and a slow round gives more than 1 finish"
run = ["{out}/frame_timer{exe}", "repeat"]
claims = { status = 0, line = ["finishes 0 2 0 3"] }
false = { run = ["{out}/frame_timer{exe}", "once"] }
