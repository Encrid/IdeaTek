[[case]]
name = "the first bytes of a ranged loader hold head_bytes bytes, and size tells the whole file"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["bytes [a.txt] offset 0 size 5 len 2 [he] settings [] error 0", "use 0 path [a.txt] type [test:Text] state 2"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_resources.toml"]
rounds = 12
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_resources_files:resources@0.1.0".config]
head_bytes = 3
[module."test:game@1.0.0".config]
script = "1:loader text,test:Text,txt,,1|2:load -,a.txt,test:Text,,0,0|12:show_resources|3:stall 300|5:stall 300|7:stall 300|9:stall 300|11:stall 300"
''' } }

