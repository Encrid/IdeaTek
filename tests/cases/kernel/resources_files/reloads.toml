[[case]]
name = "ideatek:ResourceReload reloads the resource in place, and ideatek:ResourceModified comes when it ends"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["bytes [a.txt] offset 0 size 5 len 5 [hello]", "bytes [a.txt] offset 0 size 5 len 5 [again]", "modified [a.txt]", "use 0 path [a.txt] type [test:Text] state 2 deps 2 rec 2 error 0"], lacks = ["use 1"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_resources.toml"]
rounds = 16
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:loader text,test:Text,txt,,0|2:load -,a.txt,test:Text,,0,0|9:putfile {case}/host/content/a.txt,again|16:show_resources|3:stall 300|5:stall 300|7:stall 300|9:stall 300|11:stall 300|13:stall 300|15:stall 300"
''' } }

