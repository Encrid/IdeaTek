[[case]]
name = "a loader spawns the sub-resources of a file, and each gets a view with its label"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["sub 0 path [a.txt#m1] state 2 error 0", "sub 1 path [a.txt#m2] state 2 error 0"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_resources.toml"]
rounds = 12
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:loader text,test:Text,txt,,0|1:labels a.txt,m1|2:load -,a.txt,test:Text,,0,0|12:show_labels|3:stall 300|5:stall 300|7:stall 300|9:stall 300|11:stall 300"
''' } }

[case.folders]
"{case}/host" = ["{bridge_host}/bridge-host{exe}"]
"{case}/m" = ["files_mosl", "resources_files", "sdl3_game_resources", "SDL3_test"]

