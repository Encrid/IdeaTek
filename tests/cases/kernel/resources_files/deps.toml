[[case]]
name = "a use whose owner is a resource is a dependency, and the owner folds its state"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["use 0 path [a.txt] type [test:Text] state 2 deps 2 rec 2 error 0", "use 1 path [b.txt] type [test:Text] state 2 deps 2 rec 2 error 0"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_resources.toml"]
rounds = 16
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:loader text,test:Text,txt,,0|2:load -,a.txt,test:Text,,0,0|6:load r0,none.txt,test:Text,,0,0|16:show_resources|3:stall 300|5:stall 300|7:stall 300|9:stall 300|11:stall 300|13:stall 300|15:stall 300"
''' } }

