[[case]]
name = "a set with a failed state is failed, and keeps the first error"
run = ["{out}/resources_fold{exe}", "2,0", "3,4", "3,5"]
claims = { status = 0, line = ["fold state 3 error 4 count 3"] }
false = { run = ["{out}/resources_fold{exe}", "2,0", "2,0", "3,5"] }

[[case]]
name = "a set whose states are all loaded is loaded"
run = ["{out}/resources_fold{exe}", "2,0", "2,0"]
claims = { status = 0, line = ["fold state 2 error 0 count 2"] }
false = { run = ["{out}/resources_fold{exe}", "2,0", "1,0"] }

[[case]]
name = "a set with a loading state and no failed state is loading"
run = ["{out}/resources_fold{exe}", "2,0", "1,0"]
claims = { status = 0, line = ["fold state 1 error 0 count 2"] }
false = { run = ["{out}/resources_fold{exe}", "2,0", "2,0"] }

[[case]]
name = "an empty set is loaded"
run = ["{out}/resources_fold{exe}", ]
claims = { status = 0, line = ["fold state 2 error 0 count 0"] }
false = { run = ["{out}/resources_fold{exe}", "1,0"] }
