[module."test:game@1.0.0".config]
script = "1:loader text,test:Text,txt,,0|1:labels a.txt,m1|2:load -,a.txt,test:Text,,0,0|10:usekill 0|12:show_labels|12:show_resources|3:stall 300|5:stall 300|7:stall 300|9:stall 300|11:stall 300"
'''

