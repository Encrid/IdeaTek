run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["use 0 path [a.txt] type [test:Text] state 2", "use 1 path [a.txt] type [test:Text] state 2"], matches_not = ["bytes \\[a.txt\\].*bytes \\[a.txt\\]"] }
