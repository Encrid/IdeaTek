[[case]]
name = "a load with a higher priority reads first"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, matches = ["bytes \\[b.txt\\].*bytes \\[a.txt\\]"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_resources.toml"]
rounds = 12
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_resources_files:resources@0.1.0".config]
max_reads = 1
meta_check = "never"
[module."test:game@1.0.0".config]
script = "1:loader text,test:Text,txt,,0|2:load -,a.txt,test:Text,,0,9|2:load -,b.txt,test:Text,,0,0|12:show_resources|3:stall 300|5:stall 300|7:stall 300|9:stall 300|11:stall 300"
''' } }

