[[case]]
name = "the resources module loads with the files module and the game, and a load of a text file gives a loaded resource"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["loaded: ideatek_resources_files:resources@0.1.0", "handle 0", "bytes [a.txt] offset 0 size 5 len 5 [hello] settings [] error 0", "ready [a.txt]", "use 0 path [a.txt] type [test:Text] state 2 deps 2 rec 2 error 0"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_resources.toml"]
rounds = 12
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:loader text,test:Text,txt,,0|2:load -,none.txt,test:Text,,0,0|12:show_resources|3:stall 300|5:stall 300|7:stall 300|9:stall 300|11:stall 300"
''' } }

[case.folders]
"{case}/host" = ["{bridge_host}/bridge-host{exe}"]
"{case}/m" = ["files_mosl", "resources_files", "sdl3_game_resources", "SDL3_test"]

