[[case]]
name = "the settings of the meta file go to the loader when the load gives none"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["bytes [a.txt] offset 0 size 5 len 5 [hello] settings [k = 1|] error 0"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_resources.toml"]
rounds = 12
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:loader text,test:Text,txt,,0|2:load -,a.txt,test:Text,,0,0|12:show_resources|3:stall 300|5:stall 300|7:stall 300|9:stall 300|11:stall 300"
''', "{case}/host/content/a.txt.meta" = '''
action = "load"
''' } }

[case.folders]
"{case}/host" = ["{bridge_host}/bridge-host{exe}"]
"{case}/m" = ["files_mosl", "resources_files", "sdl3_game_resources", "SDL3_test"]

[case.files]
"{case}/host/content/a.txt" = '''
hello'''
"{case}/host/content/a.txt.meta" = '''
# the meta of a
action = "load"
[settings]
k = 1
'''
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_resources.toml"]
rounds = 12
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:loader text,test:Text,txt,,0|2:load -,a.txt,test:Text,,0,0|12:show_resources|3:stall 300|5:stall 300|7:stall 300|9:stall 300|11:stall 300"
'''

