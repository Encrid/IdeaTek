[[case]]
name = "the named loader is picked"
run = ["{out}/resources_pick{exe}", "test:Text", "txt", "two", "0", "", "one;test:Text;txt;;0", "two;test:Text;bin;;0"]
claims = { status = 0, line = ["pick 1 error 0 needs 0"] }
false = { run = ["{out}/resources_pick{exe}", "test:Text", "txt", "three", "0", "", "one;test:Text;txt;;0", "two;test:Text;bin;;0"] }

[[case]]
name = "a named loader of another type gives a wrong type"
run = ["{out}/resources_pick{exe}", "test:Text", "txt", "img", "0", "", "img;test:Image;png;;0"]
claims = { status = 0, line = ["pick none error 7 needs 0"] }
false = { run = ["{out}/resources_pick{exe}", "", "txt", "img", "0", "", "img;test:Image;png;;0"] }

[[case]]
name = "the 1 loader of the type is picked"
run = ["{out}/resources_pick{exe}", "test:Text", "txt", "", "0", "", "one;test:Text;bin;;0", "two;test:Image;txt;;0"]
claims = { status = 0, line = ["pick 0 error 0 needs 0"] }
false = { run = ["{out}/resources_pick{exe}", "test:Text", "txt", "", "0", "", "one;test:Text;bin;;0", "two;test:Text;dat;;0"] }

[[case]]
name = "the loader with the extension is picked among the loaders of the type"
run = ["{out}/resources_pick{exe}", "test:Text", "txt", "", "0", "", "one;test:Text;bin;;0", "two;test:Text;txt;dat;;0"]
claims = { status = 0, line = ["pick 1 error 0 needs 0"] }
false = { run = ["{out}/resources_pick{exe}", "test:Text", "txt", "", "0", "", "one;test:Text;bin;;0", "two;test:Text;dat;;0"] }

[[case]]
name = "2 loaders with the extension need the bytes"
run = ["{out}/resources_pick{exe}", "test:Text", "txt", "", "0", "", "one;test:Text;txt;AB;0", "two;test:Text;txt;CD;0"]
claims = { status = 0, line = ["pick none error 0 needs 1"] }
false = { run = ["{out}/resources_pick{exe}", "test:Text", "txt", "", "1", "CDxyz", "one;test:Text;txt;AB;0", "two;test:Text;txt;CD;0"] }

[[case]]
name = "the magic of the bytes tells 2 loaders apart"
run = ["{out}/resources_pick{exe}", "test:Text", "txt", "", "1", "CDxyz", "one;test:Text;txt;AB;0", "two;test:Text;txt;CD;0"]
claims = { status = 0, line = ["pick 1 error 0 needs 0"] }
false = { run = ["{out}/resources_pick{exe}", "test:Text", "txt", "", "1", "ABxyz", "one;test:Text;txt;AB;0", "two;test:Text;txt;CD;0"] }

[[case]]
name = "2 loaders whose magic both fit give 2 loaders"
run = ["{out}/resources_pick{exe}", "test:Text", "txt", "", "1", "xyz", "one;test:Text;txt;;0", "two;test:Text;txt;;0"]
claims = { status = 0, line = ["pick none error 2 needs 0"] }
false = { run = ["{out}/resources_pick{exe}", "test:Text", "txt", "", "1", "xyz", "one;test:Text;txt;;0", "two;test:Text;bin;;0"] }

[[case]]
name = "no loader with the extension gives no loader"
run = ["{out}/resources_pick{exe}", "test:Text", "dat", "", "0", "", "one;test:Text;txt;;0", "two;test:Text;bin;;0"]
claims = { status = 0, line = ["pick none error 1 needs 0"] }
false = { run = ["{out}/resources_pick{exe}", "test:Text", "txt", "", "0", "", "one;test:Text;txt;;0", "two;test:Text;bin;;0"] }

[[case]]
name = "a magic longer than the bytes does not fit"
run = ["{out}/resources_pick{exe}", "test:Text", "txt", "", "1", "AB", "one;test:Text;txt;ABCDEF;0", "two;test:Text;txt;AB;0"]
claims = { status = 0, line = ["pick 1 error 0 needs 0"] }
false = { run = ["{out}/resources_pick{exe}", "test:Text", "txt", "", "1", "ABCDEF", "one;test:Text;txt;ABCDEF;0", "two;test:Text;txt;AB;0"] }

[[case]]
name = "a named loader with an empty type of the load is picked"
run = ["{out}/resources_pick{exe}", "", "txt", "img", "0", "", "img;test:Image;png;;0"]
claims = { status = 0, line = ["pick 0 error 0 needs 0"] }
false = { run = ["{out}/resources_pick{exe}", "test:Text", "txt", "img", "0", "", "img;test:Image;png;;0"] }

[[case]]
name = "an unknown name gives no loader"
run = ["{out}/resources_pick{exe}", "test:Text", "txt", "zzz", "0", "", "img;test:Image;png;;0"]
claims = { status = 0, line = ["pick none error 1 needs 0"] }
false = { run = ["{out}/resources_pick{exe}", "test:Text", "txt", "img", "0", "", "img;test:Text;png;;0"] }
