[[case]]
name = "the release of a target holds the header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "frame", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-Frame-{target}.zip", "include/ideatek_frame.h", "license",
    "package proof: BC-IdeaTek-Frame ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "frame"] }

[[case]]
name = "a timer that runs 1 time is done when the elapsed time reaches its deadline"
run = ["{out}/frame_timer{exe}", "once"]
claims = { status = 0, line = ["done 0 0 1 1"] }
false = { run = ["{out}/frame_timer{exe}", "repeat"] }

[[case]]
name = "a timer that repeats gives each finish once, and a slow round gives more than 1 finish"
run = ["{out}/frame_timer{exe}", "repeat"]
claims = { status = 0, line = ["finishes 0 2 0 3"] }
false = { run = ["{out}/frame_timer{exe}", "once"] }
