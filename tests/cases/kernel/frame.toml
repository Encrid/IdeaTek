[[case]]
name = "ideatek_frame_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/frame_layout{exe}", "frame"]
claims = { status = 0, order = ["size 64", "alignment 8", "delta 0", "elapsed 8", "real_delta 16", "real_elapsed 24", "scale 32", "wait 40", "index 48", "paused 56"] }
false = { run = ["{out}/frame_layout{exe}", "tick"] }

[[case]]
name = "ideatek_tick_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/frame_layout{exe}", "tick"]
claims = { status = 0, order = ["size 32", "alignment 8", "step 0", "elapsed 8", "tick 16", "steps 24", "fraction 28"] }
false = { run = ["{out}/frame_layout{exe}", "frame"] }

[[case]]
name = "ideatek_time_request_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/frame_layout{exe}", "time_request"]
claims = { status = 0, order = ["size 24", "alignment 8", "scale 0", "rate 8", "max_rate 12", "paused 16"] }
false = { run = ["{out}/frame_layout{exe}", "tick"] }

[[case]]
name = "each descriptor holds the bytes of its Usage"
run = ["{out}/frame_layout{exe}", "descriptors"]
claims = { status = 0, line = ["{ double delta; double elapsed; double real_delta; double real_elapsed; double scale; double wait; uint64_t index; uint8_t paused; }", "{ double step; double elapsed; uint64_t tick; uint32_t steps; float fraction; }", "{ double scale; uint32_t rate; uint32_t max_rate; uint8_t paused; }"] }
false = { run = ["{out}/frame_layout{exe}", "frame"] }

[[case]]
name = "each macro of a text gives the braces of its type and the text between them"
run = ["{out}/frame_layout{exe}", "texts"]
claims = { status = 0, line = ["{ double delta; double elapsed; double real_delta; double real_elapsed; double scale; double wait; uint64_t index; uint8_t paused; }", "{ double step; double elapsed; uint64_t tick; uint32_t steps; float fraction; }", "{ double scale; uint32_t rate; uint32_t max_rate; uint8_t paused; }"] }
false = { run = ["{out}/frame_layout{exe}", "frame"] }

[[case]]
name = "the header compiles with the headers of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/kernel", "-I", "{bridge}/include", "-c", "tests/kernel/frame_alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/kernel", "-c", "tests/kernel/frame_alone.c", "-o", "{case}/alone.o"] }

[[case]]
name = "a module declares ideatek:Frame, ideatek:Tick and ideatek:TimeRequest"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/frame_probe{library}"] }

[case.folders]
"{case}/m" = ["frame_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = ["ideatek:Frame", "ideatek:Tick", "ideatek:TimeRequest"]
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = ["ideatek:Frame", "ideatek:Tick"]
'''

