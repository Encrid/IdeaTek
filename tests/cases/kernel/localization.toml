[[case]]
name = "ideatek_locale_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/localization_layout{exe}", "locale"]
claims = { status = 0, order = ["size 16", "alignment 4", "code 0", "fallback 8"] }
false = { run = ["{out}/localization_layout{exe}", "text_syntax"] }

[[case]]
name = "ideatek_text_syntax_t is 1 byte"
run = ["{out}/localization_layout{exe}", "text_syntax"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/localization_layout{exe}", "string_table"] }

[[case]]
name = "ideatek_string_table_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/localization_layout{exe}", "string_table"]
claims = { status = 0, order = ["size 40", "alignment 8", "bytes 0", "locale 8", "domain 16", "count 24", "revision 28", "syntax 32"] }
false = { run = ["{out}/localization_layout{exe}", "text_arg"] }

[[case]]
name = "ideatek_text_arg_t is 1 byte"
run = ["{out}/localization_layout{exe}", "text_arg"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/localization_layout{exe}", "text_key"] }

[[case]]
name = "ideatek_text_key_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/localization_layout{exe}", "text_key"]
claims = { status = 0, order = ["size 24", "alignment 8", "args 0", "key 8", "source_hash 16"] }
false = { run = ["{out}/localization_layout{exe}", "localized_text"] }

[[case]]
name = "ideatek_localized_text_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/localization_layout{exe}", "localized_text"]
claims = { status = 0, order = ["size 20", "alignment 4", "text 0", "locale 8", "missing 16", "stale 17"] }
false = { run = ["{out}/localization_layout{exe}", "locale"] }

[[case]]
name = "each descriptor holds the bytes of its Usage"
run = ["{out}/localization_layout{exe}", "descriptors"]
claims = { status = 0, line = [
    "{ bridge_text_t code; bridge_text_t fallback; }",
    "uint8_t { IDEATEK_TEXT_SYNTAX_ICU = 0, IDEATEK_TEXT_SYNTAX_FLUENT = 1 }",
    "{ bridge_text_t bytes; bridge_text_t locale; uint64_t domain; uint32_t count; uint32_t revision; ideatek_text_syntax_t syntax; }",
    "uint8_t { IDEATEK_TEXT_ARG_INT = 0, IDEATEK_TEXT_ARG_FLOAT = 1, IDEATEK_TEXT_ARG_TEXT = 2 }",
    "{ bridge_text_t args; uint64_t key; uint64_t source_hash; }",
    "{ bridge_text_t text; bridge_text_t locale; bool missing; bool stale; }",
] }
false = { run = ["{out}/localization_layout{exe}", "texts"] }

[[case]]
name = "each macro of a text gives the braces of its type and the text between them"
run = ["{out}/localization_layout{exe}", "texts"]
claims = { status = 0, line = [
    "{ bridge_text_t code; bridge_text_t fallback; }",
    "{ IDEATEK_TEXT_SYNTAX_ICU = 0, IDEATEK_TEXT_SYNTAX_FLUENT = 1 }",
    "{ bridge_text_t bytes; bridge_text_t locale; uint64_t domain; uint32_t count; uint32_t revision; ideatek_text_syntax_t syntax; }",
    "{ IDEATEK_TEXT_ARG_INT = 0, IDEATEK_TEXT_ARG_FLOAT = 1, IDEATEK_TEXT_ARG_TEXT = 2 }",
    "{ bridge_text_t args; uint64_t key; uint64_t source_hash; }",
    "{ bridge_text_t text; bridge_text_t locale; bool missing; bool stale; }",
] }
false = { run = ["{out}/localization_layout{exe}", "descriptors"] }

[[case]]
name = "the header compiles with the header of the world part and the headers of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/kernel", "-I", "include/platform_abstraction", "-I", "{bridge}/include", "-c", "tests/kernel/localization_alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/kernel", "-I", "include/platform_abstraction", "-c", "tests/kernel/localization_alone.c", "-o", "{case}/alone.o"] }

[[case]]
name = "a module declares the 6 types, each type after the types of its fields"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/localization_probe{library}"] }

[case.folders]
"{case}/m" = ["localization_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_text_syntax_t", "ideatek:ideatek_text_arg_t",
    "ideatek:Locale", "ideatek:StringTable", "ideatek:TextKey",
    "ideatek:LocalizedText",
]
'''

[case.false.folders]
"{case}/m" = ["localization_late"]

