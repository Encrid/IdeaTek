[[case]]
name = "the release of a target holds the header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "localization", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-Localization-{target}.zip", "include/ideatek_localization.h", "license",
    "package proof: BC-IdeaTek-Localization ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "localization"] }
