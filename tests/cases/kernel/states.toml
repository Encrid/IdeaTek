name = "the release of a target holds the header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "states", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-States-{target}.zip", "include/ideatek_states.h", "license",
