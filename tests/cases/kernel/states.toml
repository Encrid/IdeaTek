[[case]]
name = "ideatek_state_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/states_layout{exe}", "state"]
claims = { status = 0, order = ["size 4", "alignment 4", "value 0"] }
false = { run = ["{out}/states_layout{exe}", "change"] }

[[case]]
name = "ideatek_state_request_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/states_layout{exe}", "request"]
claims = { status = 0, order = ["size 4", "alignment 4", "value 0"] }
false = { run = ["{out}/states_layout{exe}", "scoped"] }

[[case]]
name = "ideatek_state_change_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/states_layout{exe}", "change"]
claims = { status = 0, order = ["size 8", "alignment 4", "from 0", "to 4"] }
false = { run = ["{out}/states_layout{exe}", "state"] }

[[case]]
name = "ideatek_state_scoped_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/states_layout{exe}", "scoped"]
claims = { status = 0, order = ["size 16", "alignment 8", "machine 0", "value 8"] }
false = { run = ["{out}/states_layout{exe}", "change"] }

[[case]]
name = "each descriptor holds the bytes of its Usage"
run = ["{out}/states_layout{exe}", "descriptors"]
claims = { status = 0, line = [
    "{ uint32_t value; }",
    "{ uint32_t from; uint32_t to; }",
    "{ ideatek_entity_t machine; uint32_t value; }",
] }
false = { run = ["{out}/states_layout{exe}", "state"] }

[[case]]
name = "each macro of a text gives the braces of its type and the text between them"
run = ["{out}/states_layout{exe}", "texts"]
claims = { status = 0, line = [
    "{ uint32_t value; }",
    "{ uint32_t from; uint32_t to; }",
    "{ ideatek_entity_t machine; uint32_t value; }",
] }
false = { run = ["{out}/states_layout{exe}", "request"] }

[[case]]
name = "the header compiles with the headers of the world part and of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/kernel", "-I", "include/platform_abstraction", "-I", "{bridge}/include", "-c", "tests/kernel/states_alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/kernel", "-I", "include/platform_abstraction", "-c", "tests/kernel/states_alone.c", "-o", "{case}/alone.o"] }

[[case]]
name = "a module declares the 5 types, ideatek:ideatek_entity_t before ideatek:StateScoped"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/states_probe{library}"] }

[case.folders]
"{case}/m" = ["states_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:State", "ideatek:StateRequest", "ideatek:StateChange",
    "ideatek:StateScoped",
]
'''

[case.false.folders]
"{case}/m" = ["states_late"]

