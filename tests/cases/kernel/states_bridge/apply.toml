[[case]]
name = "2 requests in 1 phase keep the last"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, has = ["r2 state 0 value 3"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_states.toml"]
rounds = 2
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:machine 1|1:statereq 0,3|1:statereq 0,2|2:show_states"
''' } }

[case.folders]
"{case}/host" = ["{bridge_host}/bridge-host{exe}"]
"{case}/m" = ["states_bridge", "sdl3_game_states", "SDL3_test"]

