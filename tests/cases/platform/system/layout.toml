[[case]]
name = "ideatek_system_state_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/system_layout{exe}", "system_state"]
claims = { status = 0, order = ["size 8", "alignment 4", "locales 0"] }
false = { run = ["{out}/system_layout{exe}", "url_request"] }

[[case]]
name = "ideatek_url_request_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/system_layout{exe}", "url_request"]
claims = { status = 0, order = ["size 8", "alignment 4", "url 0"] }
false = { run = ["{out}/system_layout{exe}", "system_state"] }

[[case]]
name = "ideatek_message_level_t has the size and the alignment of its Usage"
run = ["{out}/system_layout{exe}", "message_level"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/system_layout{exe}", "system_state"] }

[[case]]
name = "ideatek_message_request_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/system_layout{exe}", "message_request"]
claims = { status = 0, order = ["size 20", "alignment 4", "title 0", "message 8", "level 16"] }
false = { run = ["{out}/system_layout{exe}", "system_state"] }

[[case]]
name = "each descriptor holds the bytes of its Usage"
run = ["{out}/system_layout{exe}", "descriptors"]
claims = { status = 0, line = ["{ bridge_text_t locales; }", "{ bridge_text_t url; }", "uint8_t { IDEATEK_MESSAGE_LEVEL_ERROR = 0, IDEATEK_MESSAGE_LEVEL_WARNING = 1, IDEATEK_MESSAGE_LEVEL_INFORMATION = 2 }", "{ bridge_text_t title; bridge_text_t message; ideatek_message_level_t level; }"] }
false = { run = ["{out}/system_layout{exe}", "system_state"] }

[[case]]
name = "each macro of a text gives the braces of its type and the text between them"
run = ["{out}/system_layout{exe}", "texts"]
claims = { status = 0, line = ["{ bridge_text_t locales; }", "{ bridge_text_t url; }", "{ IDEATEK_MESSAGE_LEVEL_ERROR = 0, IDEATEK_MESSAGE_LEVEL_WARNING = 1, IDEATEK_MESSAGE_LEVEL_INFORMATION = 2 }", "{ bridge_text_t title; bridge_text_t message; ideatek_message_level_t level; }"] }
false = { run = ["{out}/system_layout{exe}", "system_state"] }

[[case]]
name = "ideatek_system.h compiles with the headers of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/platform/system", "-I", "{bridge}/include", "-c", "tests/platform/system/layout/alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/platform/system", "-c", "tests/platform/system/layout/alone.c", "-o", "{case}/alone.o"] }
