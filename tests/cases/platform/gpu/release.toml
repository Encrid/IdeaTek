[[case]]
name = "the release of a target holds the two headers and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "gpu", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-Gpu-{target}.zip", "include/ideatek_gpu.h", "include/ideatek_vulkan.h", "license",
    "package proof: BC-IdeaTek-Gpu ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "gpu"] }
