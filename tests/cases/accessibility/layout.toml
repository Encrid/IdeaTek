[[case]]
name = "ideatek_theme_t has the size and the alignment of its Usage"
run = ["{out}/accessibility_layout{exe}", "theme"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/accessibility_layout{exe}", "state"] }

[[case]]
name = "ideatek_accessibility_state_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/accessibility_layout{exe}", "state"]
claims = { status = 0, order = ["size 6", "alignment 1", "theme 0", "increase_contrast 1", "reduce_animation 2", "reduce_transparency 3", "screen_reader 4", "speech 5"] }
false = { run = ["{out}/accessibility_layout{exe}", "speech_request"] }

[[case]]
name = "ideatek_speech_request_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/accessibility_layout{exe}", "speech_request"]
claims = { status = 0, order = ["size 12", "alignment 4", "text 0", "interrupt 8"] }
false = { run = ["{out}/accessibility_layout{exe}", "state"] }

[[case]]
name = "each descriptor holds the bytes of its Usage"
run = ["{out}/accessibility_layout{exe}", "descriptors"]
claims = { status = 0, line = ["uint8_t { IDEATEK_THEME_UNKNOWN = 0, IDEATEK_THEME_LIGHT = 1, IDEATEK_THEME_DARK = 2 }", "{ ideatek_theme_t theme; int8_t increase_contrast; int8_t reduce_animation; int8_t reduce_transparency; int8_t screen_reader; bool speech; }", "{ bridge_text_t text; bool interrupt; }"] }
false = { run = ["{out}/accessibility_layout{exe}", "state"] }

[[case]]
name = "each macro of a text gives the braces of its type and the text between them"
run = ["{out}/accessibility_layout{exe}", "texts"]
claims = { status = 0, line = ["{ IDEATEK_THEME_UNKNOWN = 0, IDEATEK_THEME_LIGHT = 1, IDEATEK_THEME_DARK = 2 }", "{ ideatek_theme_t theme; int8_t increase_contrast; int8_t reduce_animation; int8_t reduce_transparency; int8_t screen_reader; bool speech; }", "{ bridge_text_t text; bool interrupt; }"] }
false = { run = ["{out}/accessibility_layout{exe}", "state"] }

[[case]]
name = "ideatek_accessibility.h compiles with the headers of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/accessibility", "-I", "{bridge}/include", "-c", "tests/accessibility/layout/alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/accessibility", "-c", "tests/accessibility/layout/alone.c", "-o", "{case}/alone.o"] }
