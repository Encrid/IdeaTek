[[case]]
name = "a module declares the three types, the theme before the state"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/accessibility_probe{library}"] }

[case.folders]
"{case}/m" = ["accessibility_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = ["ideatek:ideatek_theme_t", "ideatek:AccessibilityState", "ideatek:SpeechRequest"]
'''

[case.false.folders]
"{case}/m" = ["accessibility_late"]

