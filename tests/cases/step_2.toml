[[case]]
name = "the 7 modules of layer 2 run together: the window opens, a content file is read and listed, a user file is written and read back, frames go to the audio device, and 2 peers of a pair exchange a message"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "{window_row1}", SDL_AUDIO_DRIVER = "ideatek_test", IDEATEK_TEST_AUDIO = "a,Speakers,p,1,48000,2", IDEATEK_TEST_AUDIO_TIMESCALE = "1000", APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["loaded: ideatek_sockets_gns:sockets@0.1.0", "seen 0 ok size 5 [hello]", "a.txt 5", "seen 2 ok size 0 []", "seen 3 ok size 4 [data]", "playback state device [Speakers] rate 48000 ch 2 queued 1000", "[hello step 2]", "down 1 repeat 0", "r8 tick 7 elapsed 0.109375 step 0.015625 steps 1 fraction 0.0000"], matches = ["r8 swap [0-9]+ frame [0-9]+ [0-9]+x[0-9]+ slot [0-9] bgra8 srgb vsync ready"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_step2.toml"]
rounds = 8
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|1:gpureq none|1:filereq content,read,a.txt,0|1:filereq content,list,,0|1:filereq user,write,s/save.txt,0,data|1:pair|2:swapreq vsync|2:audioreq p,default,-,48000,1000,2|2:stall 500|3:filereq user,read,s/save.txt,0|3:audioframes 1000|4:stall 500|6:keyevent 4 61 0 1 0|8:show_swap|8:show_tick|8:show_frame"
''' } }

[case.folders]
"{case}/host" = ["{bridge_host}/bridge-host{exe}"]
"{case}/m" = ["frame_sdl3", "window_sdl3", "input_sdl3", "gpu_vulkan_module", "files_mosl", "audio_sdl3", "sockets_gns", "sdl3_game_step2", "SDL3_test"]

[case.files]
"{case}/host/content/a.txt" = '''
hello'''
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_step2.toml"]
rounds = 8
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_frame_sdl3:clock@0.1.0".config]
time_source = "fixed"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|1:gpureq none|1:filereq content,read,a.txt,0|1:filereq content,list,,0|1:filereq user,write,s/save.txt,0,data|1:pair|2:swapreq vsync|2:audioreq p,default,-,48000,1000,2|2:send 0,0,reliable,hello step 2|2:stall 500|3:filereq user,read,s/save.txt,0|3:audioframes 1000|4:stall 500|6:keyevent 4 61 0 1 0|8:show_swap|8:show_tick|8:show_frame"
'''
