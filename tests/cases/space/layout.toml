[[case]]
name = "ideatek_vec3_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/space_layout{exe}", "vec3"]
claims = { status = 0, order = ["size 12", "alignment 4", "x 0", "y 4", "z 8"] }
false = { run = ["{out}/space_layout{exe}", "position"] }

[[case]]
name = "ideatek_quat_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/space_layout{exe}", "quat"]
claims = { status = 0, order = ["size 16", "alignment 4", "x 0", "y 4", "z 8", "w 12"] }
false = { run = ["{out}/space_layout{exe}", "vec3"] }

[[case]]
name = "ideatek_position_t has the size, the alignment and the offsets of its Usage"
