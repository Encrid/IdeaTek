[[case]]
name = "ideatek_world_transform_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/space_layout{exe}", "world_transform"]
claims = { status = 0, order = ["size 64", "alignment 8", "origin 0", "basis 24"] }
false = { run = ["{out}/space_layout{exe}", "transform"] }

[[case]]
name = "each descriptor holds the bytes of its Usage"
run = ["{out}/space_layout{exe}", "descriptors"]
claims = { status = 0, line = [
    "{ float x; float y; float z; }",
    "{ float x; float y; float z; float w; }",
    "{ double x; double y; double z; }",
    "{ uint64_t id; }",
    "{ ideatek_position_t position; ideatek_quat_t rotation; ideatek_vec3_t scale; }",
    "{ ideatek_entity_t entity; }",
    "{ ideatek_position_t origin; float basis[9]; }",
] }
false = { run = ["{out}/space_layout{exe}", "transform"] }

[[case]]
name = "each macro of a text gives the braces of its type and the text between them"
run = ["{out}/space_layout{exe}", "texts"]
claims = { status = 0, line = [
    "{ float x; float y; float z; }",
    "{ float x; float y; float z; float w; }",
    "{ double x; double y; double z; }",
    "{ uint64_t id; }",
    "{ ideatek_position_t position; ideatek_quat_t rotation; ideatek_vec3_t scale; }",
    "{ ideatek_entity_t entity; }",
    "{ ideatek_position_t origin; float basis[9]; }",
] }
false = { run = ["{out}/space_layout{exe}", "world_transform"] }

[[case]]
name = "the header compiles with the headers of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/space", "-I", "{bridge}/include", "-c", "tests/space/layout/alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/space", "-c", "tests/space/layout/alone.c", "-o", "{case}/alone.o"] }
