[[case]]
name = "a module declares the six types, each enum before the structs that have a field of it"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/window_probe{library}"] }

[case.folders]
"{case}/m" = ["window_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = ["ideatek:ideatek_place_t", "ideatek:ideatek_window_mode_t", "ideatek:ideatek_surface_t", "ideatek:WindowRequest", "ideatek:WindowState", "ideatek:MainWindow"]
'''

[case.false.folders]
"{case}/m" = ["window_late"]

