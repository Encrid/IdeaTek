[[case]]
name = "ideatek_window_mode_t has the size and the alignment of its Usage"
run = ["{out}/window_layout{exe}", "window_mode"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/window_layout{exe}", "state"] }

