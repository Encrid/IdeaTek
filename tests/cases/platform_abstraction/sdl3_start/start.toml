[[case]]
name = "the first start of SDL3 turns off each type of event that no part takes"
run = ["{out}/start_probe{exe}", "types"]
claims = { status = 0, line = [
    "off 0x0101-0x0108", "off 0x0710-0x0712", "off 0x1100-0x1102", "off 0x1200-0x1200",
    "off 0x1300-0x1307", "off 0x1400-0x1403", "off 0x2000-0x2002", "off 0x4000-0x4003",
    "off 0x8000-0xffff",
] }
false = { run = ["{out}/start_probe{exe}", "second"] }

[[case]]
name = "a start while a different module holds a subsystem turns off no type"
run = ["{out}/start_probe{exe}", "second"]
claims = { status = 0, lacks = ["off 0x"] }
false = { run = ["{out}/start_probe{exe}", "types"] }

[[case]]
name = "no type of event of SDL 3.4.20 is out of the list of the types that are off and of the ranges of the modules"
run = ["{python}", "tests/platform_abstraction/sdl3_start/event_types.py", "{sdl_root}/include/SDL3/SDL_events.h", "{out}/start_probe{exe}"]
claims = { status = 0, matches = ["each type of SDL_EventType is off or taken: [0-9]+ types"] }
false = { run = ["{python}", "tests/platform_abstraction/sdl3_start/event_types.py", "{sdl_root}/include/SDL3/SDL_events.h", "{out}/start_probe{exe}", "SDL_EVENT_PROBE=0x109"] }

[[case]]
name = "a start of the events holds the events, and its stop stops SDL3"
run = ["{out}/start_probe{exe}", "events"]
claims = { status = 0, order = ["start true: []", "held 1", "SDL3 stopped"] }
false = { run = ["{out}/start_probe{exe}", "shared"] }

[[case]]
name = "a start of the events that SDL3 refuses gives false with the reason, and holds nothing"
run = ["{out}/start_probe{exe}", "events"]
fail = { SDL_InitSubSystem = 1 }
claims = { status = 0, order = ["start false: [no probe]", "held 0"] }
false = { fail = {} }

[[case]]
name = "a start of a subsystem holds it"
run = ["{out}/start_probe{exe}", "sensor"]
claims = { status = 0, order = ["start true: []", "held 1", "SDL3 stopped"] }
false = { fail = { SDL_InitSubSystem = 2 } }

[[case]]
name = "a start of a subsystem that SDL3 refuses gives false, and stops its hold of the events"
run = ["{out}/start_probe{exe}", "sensor"]
fail = { SDL_InitSubSystem = 2 }
claims = { status = 0, order = ["start false: []", "held 0"] }
false = { fail = {} }

[[case]]
name = "a stop while a different module holds a subsystem does not stop SDL3"
run = ["{out}/start_probe{exe}", "shared"]
claims = { status = 0, order = ["start true: []", "held 1", "SDL3 runs"] }
false = { run = ["{out}/start_probe{exe}", "sensor"] }
