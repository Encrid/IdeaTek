claims = { status = 0, has = ["r3 pushed display 1", "r3 pushed exposed 1", "r3 pushed clipboard 1", "r4 has display 0", "r4 has exposed 0", "r4 has clipboard 0", "r4 has drop 0"] }

[case.folders]
"{case}/m" = ["window_sdl3", "sdl3_game", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/window_sdl3.toml"]
rounds = 4
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|3:push display|3:push exposed|3:push clipboard|3:drop file - a.txt|4:has display|4:has exposed|4:has clipboard|4:has drop"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/window_sdl3.toml"]
rounds = 4
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|3:push display|3:push exposed|3:push clipboard|3:drop file - a.txt|3:has display|3:has exposed|3:has clipboard|3:has drop"
'''
