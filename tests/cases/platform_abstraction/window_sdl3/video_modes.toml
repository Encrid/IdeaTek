[[case]]
name = "no list of the modes from SDL3 writes the line of the modes"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60 1280x720@60,1920x1080@60,desktop,1,1;b,Side,2560x1440@144*2 1280x720@0,1280x720@0,desktop,1.5,4" }
fail = { SDL_GetFullscreenDisplayModes = 1 }
claims = { status = 0, has = ["no video modes of the display "] }
false = { fail = {  } }

[case.folders]
"{case}/m" = ["window_sdl3", "sdl3_game", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/window_sdl3.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "2:request Game,640,480,exclusive,chosen,Main,-"
'''

