[[case]]
name = "a change of the primary display attaches the displays with their new is_primary"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60 1280x720@60,1920x1080@60,desktop,1,1;b,Side,2560x1440@144*2 1280x720@0,1280x720@0,desktop,1.5,4" }
claims = { status = 0, has = ["r3 attached display Side", "r3 display [Side] 1280x720 scale 1.50 hdr 1 primary 1", "r4 display [Main] 1920x1080 scale 1.00 hdr 0 primary 0"] }

[case.folders]
"{case}/m" = ["window_sdl3", "window_sdl3_game", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/window_sdl3.toml"]
rounds = 4
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "2:displays b,Side,2560x1440@144*2 1280x720@0,1280x720@0,desktop,1.5,4|3:displays b,Side,2560x1440@144*2 1280x720@0,1280x720@0,desktop,1.5,4;a,Main,1920x1080@60 1280x720@60,1920x1080@60,desktop,1,1"
'''

