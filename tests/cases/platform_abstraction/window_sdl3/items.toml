[[case]]
name = "the defaults give 32768 bytes to each half of the drops, and 2 rounds in a row use the 2 halves"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60 1280x720@60,1920x1080@60,desktop,1,1;b,Side,2560x1440@144*2 1280x720@0,1280x720@0,desktop,1.5,4" }
claims = { status = 0, has = ["r4 drop data [a] at +0", "r5 drop data [b] at +32768"] }

[case.folders]
"{case}/m" = ["window_sdl3", "window_sdl3_game", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/window_sdl3.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|3:drop file - a|4:drop file - b"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/window_sdl3.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_window_sdl3:window@0.1.0".config]
drop_bytes = 32768
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|3:drop file - a|4:drop file - b"
'''

[[case]]
name = "the defaults give 8192 bytes to each half of the pastes"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60 1280x720@60,1920x1080@60,desktop,1,1;b,Side,2560x1440@144*2 1280x720@0,1280x720@0,desktop,1.5,4" }
claims = { status = 0, has = ["r4 paste [hi] at +0", "r5 paste [hi] at +8192"] }

[case.folders]
"{case}/m" = ["window_sdl3", "window_sdl3_game", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/window_sdl3.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "2:setclip hi|3:key v {paste_mods}|4:key v {paste_mods}"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/window_sdl3.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_window_sdl3:window@0.1.0".config]
