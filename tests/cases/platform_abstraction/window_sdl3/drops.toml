[[case]]
name = "a drag over the window sets drop_over, and drop_x and drop_y follow the point"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60 1280x720@60,1920x1080@60,desktop,1,1;b,Side,2560x1440@144*2 1280x720@0,1280x720@0,desktop,1.5,4" }
claims = { status = 0, has = ["r4 state windowed", "over 1 at 50 60 "] }

[case.folders]
"{case}/m" = ["window_sdl3", "window_sdl3_game", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/window_sdl3.toml"]
rounds = 4
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|3:drag 50 60"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/window_sdl3.toml"]
rounds = 4
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|3:drag 50 70"
'''

