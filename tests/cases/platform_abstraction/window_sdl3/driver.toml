[[case]]
name = "the first row of the drivers of the system gives its surface and its 2 handles"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "{window_row1}" }
claims = { status = 0, has = ["r2 state windowed {window_surface1} ", "handles 11"] }
false = { env = { SDL_VIDEO_DRIVER = "offscreen" } }

[case.folders]
"{case}/m" = ["window_sdl3", "window_sdl3_game", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/window_sdl3.toml"]
rounds = 2
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-"
'''

