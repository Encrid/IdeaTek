[[case]]
name = "a driver of the first row with no handle of the window writes the line of the handle, and gives IDEATEK_SURFACE_NONE"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "{window_row1}" }
fail = { SDL_GetPointerProperty = 2, SDL_GetNumberProperty = 1, SDL_Metal_CreateView = 1 }
claims = { status = 1, has = ["the window has no handle of its surface: ", "r2 state windowed none "] }
false = { fail = {  } }

