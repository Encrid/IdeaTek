[[case]]
name = "more events than the room of a round wait for the next round, in their order"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, matches = ["code 0x00070006 [^\\n]* order 2 .*code 0x00070007 [^\\n]* order 0 "] }

[case.folders]
"{case}/m" = ["window_sdl3", "input_sdl3", "sdl3_game", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_input.toml"]
rounds = 6
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_input_sdl3:input@0.1.0".config]
round_entities = 3
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|4:keyevent 4 61 0 1 0|4:keyevent 5 62 0 1 0|4:keyevent 6 63 0 1 0|4:keyevent 7 64 0 1 0|4:keyevent 8 65 0 1 0"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_input.toml"]
rounds = 6
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_input_sdl3:input@0.1.0".config]
round_entities = 10
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|4:keyevent 4 61 0 1 0|4:keyevent 5 62 0 1 0|4:keyevent 6 63 0 1 0|4:keyevent 7 64 0 1 0|4:keyevent 8 65 0 1 0"
'''
