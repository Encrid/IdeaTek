[[case]]
name = "3 motions in a row with merge_motion at true give 1 event with the last place and the sum"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["motion at 12.0 14.0 rel 3.0 6.0 buttons 0 order 0"], lacks = ["order 1"] }

[case.folders]
"{case}/m" = ["window_sdl3", "input_sdl3", "sdl3_game", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_input.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|4:motion 10 10 1 2 0|4:motion 11 12 1 2 0|4:motion 12 14 1 2 0"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_input.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_input_sdl3:input@0.1.0".config]
merge_motion = false
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|4:motion 10 10 1 2 0|4:motion 11 12 1 2 0|4:motion 12 14 1 2 0"
'''

