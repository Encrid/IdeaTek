[[case]]
name = "less room in changes than an event needs keeps the event for a later round"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["r6 key code 0x00070006 key 0x00070006 char 99 mods 0x0000 down 1 repeat 0 order 0"], lacks = ["r5 key code 0x00070006"] }

[case.folders]
"{case}/m" = ["window_sdl3", "input_sdl3", "sdl3_game", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
