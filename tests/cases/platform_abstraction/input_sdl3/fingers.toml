[[case]]
name = "a finger that touches, moves 3 times and leaves gives 3 events with merge_motion at true"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["finger 7 kind 0 at 64.0 48.0 order 0", "finger 7 kind 1 at 256.0 192.0 order 1", "finger 7 kind 2 at 256.0 192.0 order 2"], lacks = ["order 3"] }

[case.folders]
"{case}/m" = ["window_sdl3", "input_sdl3", "sdl3_game", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_input.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_input_sdl3:input@0.1.0".config]
touch_mouse_events = false
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|4:touch 0 7 0.1 0.1|4:touch 1 7 0.2 0.2|4:touch 1 7 0.3 0.3|4:touch 1 7 0.4 0.4|4:touch 2 7 0.4 0.4"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_input.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_input_sdl3:input@0.1.0".config]
touch_mouse_events = false
merge_motion = false
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|4:touch 0 7 0.1 0.1|4:touch 1 7 0.2 0.2|4:touch 1 7 0.3 0.3|4:touch 1 7 0.4 0.4|4:touch 2 7 0.4 0.4"
'''

