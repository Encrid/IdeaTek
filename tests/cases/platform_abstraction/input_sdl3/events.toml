env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, matches = ["keyboard 0000000000000010 "], matches_not = ["keyboard 0000000000000010 .*keyboard 0000000000000010 "] }

