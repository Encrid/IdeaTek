[module."ideatek_input_sdl3:input@0.1.0".config]
touch_mouse_events = false
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|4:touch 0 7 0.1 0.1"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_input.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
