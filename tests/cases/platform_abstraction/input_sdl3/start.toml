[[case]]
name = "touch_mouse_events at true gives a touch as mouse events"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["button 1 down 1"] }

[case.folders]
"{case}/m" = ["window_sdl3", "input_sdl3", "sdl3_game", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_input.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|4:touch 0 7 0.1 0.1"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_input.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_input_sdl3:input@0.1.0".config]
touch_mouse_events = false
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|4:touch 0 7 0.1 0.1"
'''

[[case]]
name = "touch_mouse_events at false gives no mouse event for a touch"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["finger 7 kind 0"], lacks = ["button 1 down 1"] }

[case.folders]
"{case}/m" = ["window_sdl3", "input_sdl3", "sdl3_game", "SDL3_test"]

[case.files]
