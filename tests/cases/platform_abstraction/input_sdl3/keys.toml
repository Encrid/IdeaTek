[[case]]
name = "a key of the page 0x07 that goes down sets its bit"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["down 1 repeat 0", "keyboard 0000000000000010 "] }

[case.folders]
"{case}/m" = ["window_sdl3", "input_sdl3", "sdl3_game", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_input.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|4:keyevent 4 61 0 1 0"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_input.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|4:keyevent 5 62 0 1 0"
'''

[[case]]
