[[case]]
name = "a swapchain request on a real window gives an image in each round, with frame and slot that advance"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "{window_row1}" }
claims = { status = 0, matches = ["r4 swap [0-9]+ frame 2 640x480 slot 0 bgra8 srgb vsync ready", "r5 swap [0-9]+ frame 3 640x480 slot 1 bgra8 srgb vsync ready", "r5 vkswap [0-9]+ img [0-9a-f]+ view [0-9a-f]+ fmt 50 space 0"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_gpu.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|1:gpureq none|4:show_swap|5:show_swap|5:show_vkswap"
''' } }

[case.folders]
"{case}/m" = ["gpu_vulkan_module", "window_sdl3", "sdl3_game_gpu", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_gpu.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|1:gpureq none|2:swapreq vsync|4:show_swap|5:show_swap|5:show_vkswap"
'''

[[case]]
name = "a window with no swapchain request gets the status skipped in each round"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "{window_row1}" }
claims = { status = 0, matches = ["r4 swap [0-9]+ frame 0 0x0 slot 0 bgra8 srgb vsync skipped"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_gpu.toml"]
rounds = 4
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
