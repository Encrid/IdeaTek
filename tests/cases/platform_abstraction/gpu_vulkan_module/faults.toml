[[case]]
name = "a machine with no loader of Vulkan writes the line of the loader, and gets no gpu"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["no loader: the machine has no library of Vulkan"], matches_not = ["r[0-9] gpu [0-9]+ "] }
fail = { volkInitialize = 1 }
false = { fail = {} }

[case.folders]
"{case}/m" = ["gpu_vulkan_module", "window_sdl3", "sdl3_game_gpu", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_gpu.toml"]
rounds = 2
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "2:show_gpus"
'''

