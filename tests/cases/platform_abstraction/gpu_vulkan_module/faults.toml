[[case]]
name = "a lost device gives the status lost for 1 round, then a new device"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "{window_row1}" }
claims = { status = 0, has = ["the device is lost"], matches = ["r4 device [0-9]+ gpu [0-9]+ gen 1 features 0x0 vulkan lost", "r5 device [0-9]+ gpu [0-9]+ gen 2 features 0x0 vulkan ready"] }
fail = { vkQueuePresentKHR = 1 }
false = { fail = {} }

