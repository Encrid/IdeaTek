[[case]]
name = "a frames_in_flight of 1 writes the line of the setting, and the system begin fails"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 1, has = ["frames_in_flight: 1 is outside 2 to 3"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_gpu.toml"]
rounds = 2
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_gpu_vulkan:gpu@0.1.0".config]
frames_in_flight = 2
[module."test:game@1.0.0".config]
script = ""
''' } }

