[[case]]
name = "the gpu module loads with the window module"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60 1280x720@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, has = ["loaded: ideatek_gpu_vulkan:gpu@0.1.0, native, m/gpu_vulkan_module{library}", "loaded: ideatek_window_sdl3:window@0.1.0, native, m/window_sdl3{library}"] }
false = { folders = { "{case}/m" = ["window_sdl3", "sdl3_game", "SDL3_test"] } }

[case.folders]
"{case}/m" = ["gpu_vulkan_module", "window_sdl3", "sdl3_game", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_gpu.toml"]
rounds = 2
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = ""
'''
