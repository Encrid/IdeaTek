[[case]]
name = "the first round spawns an entity for each adapter, and the default is usable"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, matches = ["r2 gpu [0-9]+ \\[[^\\]]+\\] (integrated|discrete|virtual|cpu|other) mem [0-9]+ vendor [0-9]+ model [0-9]+ features 0x[0-9a-f]+ yes usable 1", "r2 default gpu [0-9]+"] }
false = { folders = { "{case}/m" = ["window_sdl3", "sdl3_game_gpu", "SDL3_test"] } }

[case.folders]
"{case}/m" = ["gpu_vulkan_module", "window_sdl3", "sdl3_game_gpu", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_gpu.toml"]
rounds = 2
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "2:show_gpus|2:show_default"
'''

[[case]]
name = "a request with a gpu of 0 makes a device on the default adapter, with the generation 1 and the status ready"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, matches = ["r3 device [0-9]+ gpu [0-9]+ gen 1 features 0x[0-9a-f]+ vulkan ready", "r3 vkdevice [0-9]+ inst [0-9a-f]+ phy [0-9a-f]+ dev [0-9a-f]+ q [0-9a-f]+,[0-9a-f]+,[0-9a-f]+ fam [0-9]+,[0-9]+,[0-9]+ sem [0-9a-f]+"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_gpu.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "3:show_device|3:show_vkdevice"
''' } }

[case.folders]
"{case}/m" = ["gpu_vulkan_module", "window_sdl3", "sdl3_game_gpu", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_gpu.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:gpureq none|3:show_device|3:show_vkdevice"
'''
