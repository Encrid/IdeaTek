[[case]]
name = "a window with no handles gets no surface, and the status skipped"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "ideatek_test", IDEATEK_TEST_DISPLAYS = "a,Main,1920x1080@60,1920x1080@60,desktop,1,1" }
claims = { status = 0, matches = ["r4 swap [0-9]+ frame 0 0x0 slot 0 bgra8 srgb vsync skipped"] }
false = { env = { SDL_VIDEO_DRIVER = "{window_row1}" }, files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_gpu.toml"]
rounds = 4
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:request Game,640,480,windowed,default,-,-|1:gpureq none|2:swapreq vsync|4:show_swap"
''' } }

[case.folders]
"{case}/m" = ["gpu_vulkan_module", "window_sdl3", "sdl3_game_gpu", "SDL3_test"]

