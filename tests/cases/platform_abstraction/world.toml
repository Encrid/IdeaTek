[[case]]
name = "ideatek_entity_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/world_layout{exe}", "entity"]
claims = { status = 0, order = ["size 8", "alignment 8", "id 0"] }
false = { run = ["{out}/world_layout{exe}", "descriptors"] }

[[case]]
name = "each descriptor holds the bytes of its Usage"
run = ["{out}/world_layout{exe}", "descriptors"]
claims = { status = 0, line = ["{ uint64_t id; }"] }
false = { run = ["{out}/world_layout{exe}", "entity"] }

[[case]]
name = "each macro of a text gives the braces of its type and the text between them"
run = ["{out}/world_layout{exe}", "texts"]
claims = { status = 0, line = ["{ uint64_t id; }"] }
false = { run = ["{out}/world_layout{exe}", "entity"] }

[[case]]
name = "the header compiles with the headers of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/platform_abstraction", "-I", "{bridge}/include", "-c", "tests/platform_abstraction/world_alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/platform_abstraction", "-c", "tests/platform_abstraction/world_alone.c", "-o", "{case}/alone.o"] }

[[case]]
name = "the release of a target holds the header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "world", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-World-{target}.zip", "include/ideatek_world.h", "license",
    "package proof: BC-IdeaTek-World ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "world"] }
