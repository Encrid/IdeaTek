[[case]]
name = "an address request for localhost gives 1 address or more with the status ok"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, matches = ["addr 0 ok count [1-9][0-9]* \\[(::1:0|v4 127.0.0.1:0)\\]"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_sockets.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:addr nonexistent.invalid|2:stall 500|3:stall 500|4:stall 500|5:show_count"
''' } }

