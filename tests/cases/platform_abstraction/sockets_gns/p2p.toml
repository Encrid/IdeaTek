[[case]]
name = "a P2P connect through the signals of 2 programs connects both ends, and a message crosses"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
helper = { run = ["{bridge_host}/bridge-host{exe}", "{case}/s.toml"], wait = "listen 0 listening", stdin = "", claims = { has = ["inbound 1 listen 0", "conn 1 connected", "[over the signals]"] } }
claims = { status = 0, has = ["signal out 0 to [str:server]", "signal in", "conn 0 connected"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_sockets.toml"]
rounds = 36
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_sockets_gns:sockets@0.1.0".config]
ice_transports = "private,public"
timeout_initial = 8000
[module."test:game@1.0.0".config]
script = "1:identity str:client|1:signals {case}/sig|2:stall 200|3:p2p str:server,9,0|4:stall 200|5:stall 200|6:stall 200|7:stall 200|8:stall 200|9:stall 200|10:stall 200|11:stall 200|12:stall 200|13:stall 200|14:stall 200|15:stall 200|16:stall 200|17:stall 200|18:stall 200|19:stall 200|20:stall 200|21:stall 200|22:stall 200|23:stall 200|24:stall 200|25:stall 200|26:stall 200|27:stall 200|28:stall 200|29:stall 200|30:stall 200|31:stall 200|32:stall 200|33:stall 200|34:stall 200|35:stall 200|36:show_conns"
''' } }

