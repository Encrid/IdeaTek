[[case]]
name = "a lanes request with 2 lanes gives the lane states in each round"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, has = ["lanes 0 count 2", "r6 lane 0/0 queue", "r6 lane 0/1 queue"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_sockets.toml"]
rounds = 6
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:pair|2:stall 30|3:stall 30|4:stall 30|5:stall 30|6:show_lanes"
''' } }

[case.folders]
