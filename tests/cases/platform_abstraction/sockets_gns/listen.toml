[[case]]
name = "a destroyed listen entity closes the listen socket, and a connect to its port gets the problem"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, has = ["conn 1 problem"], matches_not = ["inbound"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_sockets.toml"]
rounds = 21
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_sockets_gns:sockets@0.1.0".config]
timeout_initial = 300
[module."test:game@1.0.0".config]
script = "1:listen ip,{port},0|3:connect local,{port},,,0|3:stall 50|4:stall 50|5:stall 50|6:stall 50|7:stall 50|8:stall 50|9:stall 50|10:stall 50|11:stall 50|12:stall 50|13:stall 50|14:stall 50|15:stall 50|16:stall 50|17:stall 50|18:stall 50|19:stall 50|20:stall 50|21:show_conns"
''' } }

