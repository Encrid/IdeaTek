[[case]]
name = "a listen request over IP opens a listen socket on the port, and its state says listening"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, has = ["listen 0 listening"], matches = ["r3 listen 0 kind 0 port [0-9]+ vport 0 listening"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_sockets.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:listen ip,{port},0|2:stall 30|3:show_count"
''' } }

[case.folders]
"{case}/m" = ["sockets_gns", "sdl3_game_sockets", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
