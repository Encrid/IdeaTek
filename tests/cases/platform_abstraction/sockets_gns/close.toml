[[case]]
name = "a close of a connection gives the peer the status closed by peer, with the reason and the text of the game"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, has = ["r12 conn 2 closed_by_peer", "end 1234 [closed by the game]"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_sockets.toml"]
rounds = 12
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:listen ip,{port},0|1:connect local,{port},,,0|2:stall 30|3:stall 30|4:stall 30|5:conn 2,accept|5:stall 30|6:stall 30|7:stall 30|8:stall 30|9:stall 30|12:show_conns"
''' } }

