[case.files]
"{case}/s.toml" = '''
presets = ["{root}/tests/presets/sdl3_sockets.toml"]
rounds = 46
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_sockets_gns:sockets@0.1.0".config]
ice_transports = "private,public"
timeout_initial = 8000
max_connections = 1
[module."test:game@1.0.0".config]
script = "1:identity str:server|1:signals {case}/sig|2:listen p2p,0,7|3:sess open,str:other,0|4:stall 200|5:stall 200|6:stall 200|7:stall 200|8:stall 200|9:stall 200|10:stall 200|11:stall 200|12:stall 200|13:stall 200|14:stall 200|15:stall 200|16:stall 200|17:stall 200|18:stall 200|19:stall 200|20:stall 200|21:stall 200|22:stall 200|23:stall 200|24:stall 200|25:stall 200|26:stall 200|27:stall 200|28:stall 200|29:stall 200|30:stall 200|31:stall 200|32:stall 200|33:stall 200|34:stall 200|35:stall 200|36:stall 200|37:stall 200|38:stall 200|39:stall 200|40:stall 200|41:stall 200|42:stall 200|43:stall 200|44:stall 200|45:stall 200|46:show_count"
'''
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_sockets.toml"]
rounds = 36
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_sockets_gns:sockets@0.1.0".config]
ice_transports = "private,public"
timeout_initial = 8000
[module."test:game@1.0.0".config]
script = "1:identity str:client|1:signals {case}/sig|2:stall 200|3:sess open,str:server,0|4:sesssend 0,0,reliable,hello session|4:stall 200|5:stall 200|6:stall 200|7:stall 200|8:stall 200|9:stall 200|10:stall 200|11:stall 200|12:stall 200|13:stall 200|14:stall 200|15:stall 200|16:stall 200|17:stall 200|18:stall 200|19:stall 200|20:stall 200|21:stall 200|22:stall 200|23:stall 200|24:stall 200|25:stall 200|26:stall 200|27:stall 200|28:stall 200|29:stall 200|30:stall 200|31:stall 200|32:stall 200|33:stall 200|34:stall 200|35:stall 200|36:show_sessions"
'''

[[case]]
name = "a session open on an entity that has a session writes the line of the action"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, matches = ["the request of [0-9]+: action 0 is outside a session"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_sockets.toml"]
rounds = 4
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:identity str:me|2:sess open,str:far,0|4:show_sessions"
''' } }

