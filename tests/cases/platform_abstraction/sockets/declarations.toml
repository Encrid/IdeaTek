[[case]]
name = "a module declares the sixteen types, the field types before the structures"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/sockets_probe{library}"] }

[case.folders]
"{case}/m" = ["sockets_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = ["ideatek:ideatek_entity_t", "ideatek:ideatek_address_t", "ideatek:ideatek_send_t", "ideatek:ideatek_listen_status_t", "ideatek:ideatek_connection_action_t", "ideatek:ideatek_connection_status_t", "ideatek:ideatek_address_status_t", "ideatek:ListenRequest", "ideatek:ConnectionRequest", "ideatek:MessagesOut", "ideatek:AddressRequest", "ideatek:ListenState", "ideatek:Inbound", "ideatek:ConnectionState", "ideatek:MessagesIn", "ideatek:AddressResult"]
'''

[case.false.folders]
"{case}/m" = ["sockets_late"]

