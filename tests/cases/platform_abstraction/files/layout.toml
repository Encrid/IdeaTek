[[case]]
name = "ideatek_storage_t has the size and the alignment of its Usage"
run = ["{out}/files_layout{exe}", "storage"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/files_layout{exe}", "request"] }

[[case]]
name = "ideatek_file_action_t has the size and the alignment of its Usage"
run = ["{out}/files_layout{exe}", "action"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/files_layout{exe}", "request"] }

[[case]]
name = "ideatek_file_status_t has the size and the alignment of its Usage"
run = ["{out}/files_layout{exe}", "status"]
claims = { status = 0, order = ["size 1", "alignment 1"] }
false = { run = ["{out}/files_layout{exe}", "request"] }

[[case]]
name = "ideatek_file_request_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/files_layout{exe}", "request"]
claims = { status = 0, order = ["size 40", "alignment 8", "offset 0", "length 8", "path 16", "data 24", "storage 32", "action 33"] }
false = { run = ["{out}/files_layout{exe}", "result"] }

[[case]]
name = "ideatek_file_result_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/files_layout{exe}", "result"]
claims = { status = 0, order = ["size 24", "alignment 8", "size 0", "data 8", "status 16"] }
false = { run = ["{out}/files_layout{exe}", "request"] }

[[case]]
name = "ideatek_file_change_t has the size, the alignment and the offsets of its Usage"
run = ["{out}/files_layout{exe}", "change"]
claims = { status = 0, order = ["size 8", "alignment 4", "paths 0"] }
false = { run = ["{out}/files_layout{exe}", "result"] }

[[case]]
name = "each descriptor holds the bytes of its Usage"
run = ["{out}/files_layout{exe}", "descriptors"]
claims = { status = 0, line = ["uint8_t { IDEATEK_STORAGE_CONTENT = 0, IDEATEK_STORAGE_USER = 1 }", "uint8_t { IDEATEK_FILE_ACTION_READ = 0, IDEATEK_FILE_ACTION_WRITE = 1, IDEATEK_FILE_ACTION_LIST = 2, IDEATEK_FILE_ACTION_REMOVE = 3, IDEATEK_FILE_ACTION_WATCH = 4 }", "uint8_t { IDEATEK_FILE_STATUS_OK = 0, IDEATEK_FILE_STATUS_NOT_FOUND = 1, IDEATEK_FILE_STATUS_TOO_BIG = 2, IDEATEK_FILE_STATUS_DENIED = 3, IDEATEK_FILE_STATUS_FAILED = 4, IDEATEK_FILE_STATUS_UNSUPPORTED = 5 }", "{ uint64_t offset; uint64_t length; bridge_text_t path; bridge_text_t data; ideatek_storage_t storage; ideatek_file_action_t action; }", "{ uint64_t size; bridge_text_t data; ideatek_file_status_t status; }", "{ bridge_text_t paths; }"] }
false = { run = ["{out}/files_layout{exe}", "request"] }

[[case]]
name = "each macro of a text gives the braces of its type and the text between them"
run = ["{out}/files_layout{exe}", "texts"]
claims = { status = 0, line = ["{ IDEATEK_STORAGE_CONTENT = 0, IDEATEK_STORAGE_USER = 1 }", "{ IDEATEK_FILE_ACTION_READ = 0, IDEATEK_FILE_ACTION_WRITE = 1, IDEATEK_FILE_ACTION_LIST = 2, IDEATEK_FILE_ACTION_REMOVE = 3, IDEATEK_FILE_ACTION_WATCH = 4 }", "{ IDEATEK_FILE_STATUS_OK = 0, IDEATEK_FILE_STATUS_NOT_FOUND = 1, IDEATEK_FILE_STATUS_TOO_BIG = 2, IDEATEK_FILE_STATUS_DENIED = 3, IDEATEK_FILE_STATUS_FAILED = 4, IDEATEK_FILE_STATUS_UNSUPPORTED = 5 }", "{ uint64_t offset; uint64_t length; bridge_text_t path; bridge_text_t data; ideatek_storage_t storage; ideatek_file_action_t action; }", "{ uint64_t size; bridge_text_t data; ideatek_file_status_t status; }", "{ bridge_text_t paths; }"] }
false = { run = ["{out}/files_layout{exe}", "request"] }

[[case]]
name = "ideatek_files.h compiles with the headers of Bridge and nothing else"
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/platform_abstraction/files", "-I", "{bridge}/include", "-c", "tests/platform_abstraction/files/layout/alone.c", "-o", "{case}/alone.o"]
claims = { status = 0 }
false = { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/platform_abstraction/files", "-c", "tests/platform_abstraction/files/layout/alone.c", "-o", "{case}/alone.o"] }
