env = { SDL_AUDIO_DRIVER = "ideatek_test", IDEATEK_TEST_AUDIO = "a,Speakers,p,1,48000,2;b,Headset,p,0,44100,2;c,Microphone,r,1,48000,1;d,Webcam Mic,r,0,16000,1", IDEATEK_TEST_AUDIO_TIMESCALE = "1000" }
claims = { status = 1, has = ["stream_name: a text of 0 bytes is outside 1 to 255 bytes"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_audio.toml"]
rounds = 2
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_audio_sdl3:audio@0.1.0".config]
stream_name = "Game"
[module."test:game@1.0.0".config]
script = "none"
''' } }

[case.folders]
"{case}/m" = ["audio_sdl3", "sdl3_game_audio", "SDL3_test"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_audio.toml"]
rounds = 2
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
