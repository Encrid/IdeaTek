    "{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include/platform_abstraction/input", "-I",
    "{bridge}/include", "-c", "tests/platform_abstraction/input/layout/alone_input.c", "-o", "{case}/alone_input.o",
