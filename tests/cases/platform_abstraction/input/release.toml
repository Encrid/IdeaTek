[[case]]
name = "the release of a target holds the six headers and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "input", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-Input-{target}.zip",
    "include/ideatek_input.h",
    "include/ideatek_keyboard.h",
    "include/ideatek_text.h",
    "include/ideatek_mouse.h",
    "include/ideatek_gamepad.h",
    "include/ideatek_touch.h",
    "license",
    "package proof: BC-IdeaTek-Input ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "input"] }
