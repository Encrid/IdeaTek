[[case]]
name = "the release of a target holds the header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "system", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BC-IdeaTek-System-{target}.zip", "include/ideatek_system.h", "license",
    "package proof: BC-IdeaTek-System ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "system"] }
