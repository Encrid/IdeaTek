[[case]]
name = "the files module loads with the game, and a read of the content storage gives the file"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["loaded: ideatek_files_mosl:files@0.1.0", "r3 result 0 ok size 5 [hello]"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:filereq content,read,none.txt,0|2:stall 500|3:show_results"
''' } }

[case.folders]
"{case}/host" = ["{bridge_host}/bridge-host{exe}"]
"{case}/m" = ["files_mosl", "sdl3_game_files", "SDL3_test"]

[case.files]
"{case}/host/content/a.txt" = '''
hello'''
"{case}/host/content/b.bin" = '''
xyz'''
"{case}/host/content/sub/e.txt" = '''
inner'''
"{case}/host/content/w/keep.txt" = '''
k'''
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:filereq content,read,a.txt,0|2:stall 500|3:show_results"
'''

[[case]]
name = "a reload gives 0, because the module is not reloadable"
run = ["{out}/files_mosl_reload{exe}", "reload"]
claims = { status = 0, line = ["reload 0"] }
false = { run = ["{out}/files_mosl_reload{exe}", "shutdown"] }

[[case]]
name = "a system that refuses the mutex of the module fails the load with the line of the thread"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
fail = { os_mutex_create = 1 }
claims = { has = ["no thread"] }
false = { fail = {} }

