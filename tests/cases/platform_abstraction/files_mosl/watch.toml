[[case]]
name = "a watch of a folder of the content storage gives a change for a new file"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["r2 result 0 ok size 0 []"], matches = ["r[3-8] change 0 \\[w/new.txt"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 8
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:filereq content,watch,sub,0|2:show_results|3:show_changes|4:show_changes|5:show_changes|6:show_changes|7:show_changes|8:show_changes"
''' } }
script = [{ wait = "r2 result 0", put = { "{case}/host/content/w/new.txt" = "{case}/new.txt" } }]

[case.folders]
"{case}/host" = ["{bridge_host}/bridge-host{exe}"]
"{case}/m" = ["files_mosl", "sdl3_game_files", "SDL3_test"]

[case.files]
"{case}/host/content/a.txt" = '''
hello'''
"{case}/host/content/b.bin" = '''
xyz'''
"{case}/host/content/sub/e.txt" = '''
inner'''
"{case}/host/content/w/keep.txt" = '''
k'''
"{case}/new.txt" = '''
n'''
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 8
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:filereq content,watch,w,0|2:show_results|3:show_changes|4:show_changes|5:show_changes|6:show_changes|7:show_changes|8:show_changes"
'''

[[case]]
name = "a watch whose folder goes gives the status not found, and the line of the stop"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["r2 result 0 ok size 0 []", "the watch of w stopped"], matches = ["r[4-6] result 0 not_found"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 6
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:filereq content,watch,w,0|2:show_results|3:rmpath {case}/host/content/sub|4:show_results|5:show_results|6:show_results"
''' } }

[case.folders]
"{case}/host" = ["{bridge_host}/bridge-host{exe}"]
"{case}/m" = ["files_mosl", "sdl3_game_files", "SDL3_test"]
"{case}/host/content/w" = []

[case.files]
"{case}/host/content/a.txt" = '''
hello'''
