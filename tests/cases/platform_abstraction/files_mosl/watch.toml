[[case]]
name = "a watch of a folder of the content storage gives a change for a new file"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["seen 0 ok size 0 []"], matches = ["r[4-6] change 0 \\[w/new.txt"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 6
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:filereq content,watch,sub,0|2:show_results|3:putfile {case}/host/content/w/new.txt,n|3:stall 1500|4:show_changes|5:stall 1500|6:show_changes"
''' } }

[case.folders]
"{case}/host" = ["{bridge_host}/bridge-host{exe}"]
"{case}/m" = ["files_mosl", "sdl3_game_files", "SDL3_test"]

[case.files]
"{case}/host/content/a.txt" = '''
hello'''
"{case}/host/content/b.bin" = '''
xyz123456789'''
"{case}/host/content/sub/e.txt" = '''
inner'''
"{case}/host/content/w/keep.txt" = '''
k'''
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 6
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:filereq content,watch,w,0|2:show_results|3:putfile {case}/host/content/w/new.txt,n|3:stall 1500|4:show_changes|5:stall 1500|6:show_changes"
'''

