[[case]]
name = "the results that do not fit in the changes of a round wait for the next round"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["r3 result 0 ok", "r3 result 1 ok", "r4 result 2 ok"], matches_not = ["r3 result 2 "] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 5
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_files_mosl:files@0.1.0"]
changes = 100
[module."test:game@1.0.0".config]
script = "1:filereq content,read,a.txt,0|1:filereq content,read,a.txt,0|2:stall 500|3:show_results|4:show_results|5:show_results"
''' } }

