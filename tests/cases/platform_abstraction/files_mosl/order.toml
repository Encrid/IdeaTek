[[case]]
name = "the requests of a round come back in the order of their priorities"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, matches = ["seen 1.*seen 2.*seen 0"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:filereq content,read,a.txt,9|1:filereq content,read,b.bin,5|1:filereq content,read,sub/e.txt,1|2:stall 500|3:show_results"
''' } }

[case.folders]
"{case}/host" = ["{bridge_host}/bridge-host{exe}"]
"{case}/m" = ["files_mosl", "sdl3_game_files", "SDL3_test"]

[case.files]
"{case}/host/content/a.txt" = '''
hello'''
"{case}/host/content/b.bin" = '''
xyz'''
"{case}/host/content/sub/e.txt" = '''
inner'''
"{case}/host/content/w/keep.txt" = '''
k'''
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:filereq content,read,a.txt,1|1:filereq content,read,b.bin,9|1:filereq content,read,sub/e.txt,5|2:stall 500|3:show_results"
'''
