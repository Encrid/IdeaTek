[[case]]
name = "a removal of a file of the user storage removes it, and a read then gives not found"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["seen 1 ok size 0 []"], matches = ["seen 2 not_found"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 7
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:filereq user,write,r.txt,0,gone|2:stall 500|3:filereq user,remove,x.txt,0|4:stall 500|5:filereq user,read,r.txt,0|5:show_results|6:stall 500|7:show_results"
''' } }

[case.folders]
"{case}/host" = ["{bridge_host}/bridge-host{exe}"]
"{case}/m" = ["files_mosl", "sdl3_game_files", "SDL3_test"]

[case.files]
"{case}/host/content/a.txt" = '''
hello'''
"{case}/host/content/b.bin" = '''
xyz123456789'''
"{case}/host/content/sub/e.txt" = '''
inner'''
"{case}/host/content/w/keep.txt" = '''
k'''
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 7
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:filereq user,write,r.txt,0,gone|2:stall 500|3:filereq user,remove,r.txt,0|4:stall 500|5:filereq user,read,r.txt,0|5:show_results|6:stall 500|7:show_results"
'''

