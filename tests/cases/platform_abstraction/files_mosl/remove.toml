[[case]]
name = "a removal of a file of the user storage removes it, and a read then gives not found"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["r3 result 1 ok size 0 []"], matches = ["r4 result 2 not_found"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:filereq user,write,r.txt,0,gone|2:filereq user,remove,x.txt,0|3:filereq user,read,r.txt,0|3:show_results|4:show_results"
''' } }

[case.folders]
"{case}/host" = ["{bridge_host}/bridge-host{exe}"]
"{case}/m" = ["files_mosl", "sdl3_game_files", "SDL3_test"]

[case.files]
"{case}/host/content/a.txt" = '''
hello'''
"{case}/host/content/b.bin" = '''
xyz'''
"{case}/host/content/sub/e.txt" = '''
inner'''
"{case}/host/content/w/keep.txt" = '''
k'''
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 3
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:game@1.0.0".config]
script = "1:filereq user,write,r.txt,0,gone|2:filereq user,remove,r.txt,0|3:filereq user,read,r.txt,0|3:show_results|4:show_results"
'''

