[[case]]
name = "with deterministic_rounds 4, the result of a request of round 1 is attached in round 5"
run = ["{case}/host/bridge-host{exe}", "{case}/d.toml"]
env = { APPDATA = "{case}/data", XDG_DATA_HOME = "{case}/data", HOME = "{case}/data" }
claims = { status = 0, has = ["r5 seen 0 ok size 5 [hello]"] }
false = { files = { "{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 8
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_files_mosl:files@0.1.0".config]
deterministic_rounds = 0
[module."test:game@1.0.0".config]
script = "1:filereq content,read,a.txt,0|2:stall 300"
''' } }

[case.folders]
"{case}/host" = ["{bridge_host}/bridge-host{exe}"]
"{case}/m" = ["files_mosl", "sdl3_game_files", "SDL3_test"]

[case.files]
"{case}/host/content/a.txt" = '''
hello'''
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/sdl3_files.toml"]
rounds = 8
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."ideatek_files_mosl:files@0.1.0".config]
deterministic_rounds = 4
[module."test:game@1.0.0".config]
script = "1:filereq content,read,a.txt,0|2:stall 300"
'''

