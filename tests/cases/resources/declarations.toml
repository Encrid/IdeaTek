[[case]]
name = "a module declares the 14 types, the 3 types of the fields before the 7 structures"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/resources_probe{library}"] }

[case.folders]
"{case}/m" = ["resources_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = [
    "ideatek:ideatek_entity_t", "ideatek:ideatek_load_state_t", "ideatek:ideatek_resource_error_t",
    "ideatek:ResourceLoad", "ideatek:ResourceHandle", "ideatek:Resource", "ideatek:ResourceLoader",
    "ideatek:ResourceBytes", "ideatek:ResourceOutcome", "ideatek:ResourceLabel",
    "ideatek:ResourceReload", "ideatek:ResourceModified", "ideatek:ResourceReady",
    "ideatek:ResourceFailed",
]
'''

[case.false.folders]
"{case}/m" = ["resources_late"]

