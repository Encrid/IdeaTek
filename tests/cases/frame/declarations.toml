[[case]]
name = "a module declares ideatek:Frame, ideatek:Tick and ideatek:TimeRequest"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/frame_probe{library}"] }

[case.folders]
"{case}/m" = ["frame_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = ["ideatek:Frame", "ideatek:Tick", "ideatek:TimeRequest"]
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = ["ideatek:Frame", "ideatek:Tick"]
'''

