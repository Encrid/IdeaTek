[[case]]
name = "a module declares the sixteen types, the field types before the structures"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:probe@1.0.0, native, m/gpu_probe{library}"] }

[case.folders]
"{case}/m" = ["gpu_probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/check.toml"]
[content]
paths = ["m"]
[backend.native]
library = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = ["ideatek:ideatek_entity_t", "ideatek:ideatek_gpu_kind_t", "ideatek:ideatek_gpu_api_t", "ideatek:ideatek_gpu_status_t", "ideatek:ideatek_present_mode_t", "ideatek:ideatek_image_format_t", "ideatek:ideatek_color_space_t", "ideatek:ideatek_swapchain_status_t", "ideatek:GpuRequest", "ideatek:SwapchainRequest", "ideatek:Gpu", "ideatek:DefaultGpu", "ideatek:GpuDevice", "ideatek:Swapchain", "ideatek:VulkanDevice", "ideatek:VulkanSwapchain"]
'''

[case.false.folders]
"{case}/m" = ["gpu_late"]

