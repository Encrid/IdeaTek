presets = ["test.toml"]
phases = ["first", "fixed", "check"]
again = { fixed = 100 }

[budget]
systems = 128
terms = 128
tables = 128
persistent = 16777216

[module."ideatek_frame_sdl3:clock@0.1.0"]
write = ["ideatek:Frame", "ideatek:Tick", "ideatek:TimeRequest", "ideatek:EventWait"]
read = ["ideatek:ideatek_entity_t", "ideatek:ideatek_window_mode_t", "ideatek:ideatek_surface_t", "ideatek:WindowState"]

[module."ideatek_window_sdl3:window@0.1.0"]
